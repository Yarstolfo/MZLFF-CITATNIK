<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a09">
  <title>Переезд на новый сайт — mzlff цитаты</title>
  <style>
    /* ── стиль в духе исходного сайта ── */
    :root {
      color-scheme: dark;
      --ink: #080a09;
      --paper: #f3f4ef;
      --muted: #858585;
      --acid: #ffffff;
      --purple: #b98cff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100svh;
      background: var(--ink);
      color: var(--paper);
      font-family: "Arial", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    /* точечный фон, как на оригинале */
    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      opacity: .18;
      background-image: radial-gradient(#ffffff 0.65px, transparent 0.65px);
      background-size: 7px 7px;
      mask-image: linear-gradient(115deg, transparent 8%, #000 60%, transparent 98%);
    }
    .redirect-card {
      position: relative;
      z-index: 1;
      max-width: 680px;
      width: 100%;
      padding: 48px 40px 52px;
      border: 1px solid #ffffff24;
      background: #111412e8;
      backdrop-filter: blur(2px);
      text-align: center;
      animation: card-in 0.65s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(-10px) scale(0.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--paper);
    }
    .brand-mark {
      width: 10px;
      height: 10px;
      background: var(--acid);
      flex: 0 0 auto;
    }

    .title {
      font-size: clamp(26px, 5vw, 40px);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1.18;
      margin-bottom: 16px;
    }
    .title .accent {
      color: var(--purple);
    }
    .subtitle {
      font-size: 15px;
      line-height: 1.6;
      color: #adb2ae;
      font-weight: 600;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    .domain-badge {
      display: inline-block;
      padding: 12px 24px;
      border: 1px solid #b98cff70;
      background: #1a1428;
      color: #d9c2ff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .06em;
      word-break: break-all;
      margin-bottom: 28px;
      transition: border-color .2s ease, background .2s ease;
    }
    .domain-badge:hover {
      border-color: #b98cff;
      background: #1f1830;
    }

    .redirect-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 58px;
      padding: 0 32px;
      border: 0;
      background: var(--acid);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
      margin-bottom: 18px;
    }
    .redirect-btn:hover {
      transform: translateY(-3px);
      background: #d9d9d9;
    }
    .redirect-btn .arrow {
      display: inline-flex;
      width: 16px;
      height: 16px;
    }
    .redirect-btn .arrow svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .timer-note {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }
    .timer-note .seconds {
      color: var(--paper);
      font-variant-numeric: tabular-nums;
    }

    .legacy-note {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid #ffffff14;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #5c6360;
      line-height: 1.8;
    }
    .legacy-note strong {
      color: #858585;
      font-weight: 800;
    }

    @media (max-width: 560px) {
      .redirect-card {
        padding: 36px 22px 40px;
      }
      .domain-badge {
        font-size: 12px;
        padding: 10px 16px;
      }
      .redirect-btn {
        min-height: 52px;
        padding: 0 22px;
        font-size: 11px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>mzlff</span>
    </div>

    <h1 class="title">
      Сайт переехал на<br>
      <span class="accent">новый домен</span>
    </h1>

    <p class="subtitle">
      Все цитаты, достижения и каталог теперь доступны по новому адресу.
    </p>

    <a class="domain-badge" href="https://mzlff-citations.netlify.app/" id="newDomainLink">
      https://mzlff-citations.netlify.app/
    </a>

    <br>

    <a class="redirect-btn" href="https://mzlff-citations.netlify.app/" id="redirectButton">
      <span>Перейти на новый сайт</span>
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
        </svg>
      </span>
    </a>

    <p class="timer-note">
      Автоматический переход через <span class="seconds" id="countdown">10</span> сек.
    </p>

    <div class="legacy-note">
      <strong>Старый адрес</strong> больше не обновляется.<br>
      Пожалуйста, обновите закладки.
    </div>
  </div>

  <script>
    (function() {
      var NEW_URL = 'https://mzlff-citations.netlify.app/';
      var SECONDS = 10;
      var countdownEl = document.getElementById('countdown');
      var redirectBtn = document.getElementById('redirectButton');
      var domainLink = document.getElementById('newDomainLink');

      // Убедимся, что ссылки ведут на правильный URL (на случай, если константа изменится)
      redirectBtn.href = NEW_URL;
      domainLink.href = NEW_URL;

      // Обратный отсчёт
      var remaining = SECONDS;
      countdownEl.textContent = remaining;

      var timer = setInterval(function() {
        remaining -= 1;
        countdownEl.textContent = remaining > 0 ? remaining : 0;
        if (remaining <= 0) {
          clearInterval(timer);
          // Перенаправляем
          window.location.replace(NEW_URL);
        }
      }, 1000);

      // Если пользователь нажал на кнопку или ссылку — очищаем таймер и переходим (переход произойдёт сам)
      function goToNewSite(e) {
        clearInterval(timer);
        // Не предотвращаем действие по умолчанию, чтобы ссылка сработала.
        // Но если это кнопка (a), браузер сам перейдёт.
        // Дополнительно можно сделать replace, но не обязательно.
      }

      redirectBtn.addEventListener('click', function(e) {
        clearInterval(timer);
        // Даём браузеру перейти по ссылке; на всякий случай — replace
        e.preventDefault();
        window.location.replace(NEW_URL);
      });

      domainLink.addEventListener('click', function(e) {
        clearInterval(timer);
        e.preventDefault();
        window.location.replace(NEW_URL);
      });

      // Если страница восстанавливается из bfcache, перезапускаем таймер? Нет, просто оставим.
      // При загрузке из кеша всё сбросится.
      window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
          // Если вернулись назад, можно перезапустить отсчёт, но не обязательно.
          // Оставим как есть — пользователь сам увидит кнопку.
        }
      });
    })();
  </script>
</body>
</html>
