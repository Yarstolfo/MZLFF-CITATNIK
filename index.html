<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a09">
<title>Цитатник MZLFF</title>
<style>
:root {
    color-scheme: dark;
    --ink: #080a09;
    --paper: #f3f4ef;
    --muted: #858585;
    --mint: #ffffff;
    --acid: #ffffff;
}
* { box-sizing: border-box; }

body {
    min-height: 100svh;
    margin: 0;
    overflow-x: hidden;
    background: var(--ink);
    color: var(--paper);
    font-family: "Arial", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
}

body::before {
    position: fixed;
    z-index: 0;
    inset: 0;
    pointer-events: none;
    content: "";
    opacity: .18;
    background-image: radial-gradient(#ffffff 0.65px, transparent 0.65px);
    background-size: 7px 7px;
    mask-image: linear-gradient(115deg, transparent 8%, #000 60%, transparent 98%);
}

.page {
    position: relative;
    z-index: 1;
    display: flex;
    min-height: 100svh;
    flex-direction: column;
    width: min(100% - 48px, 1280px);
    margin: auto;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 10px; height: 10px; background: var(--acid); }

/* ── Достижения ── */
.achievements-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #ffffff14;
    background: #0b0d0c;
}
.achievements-bar .ach-title {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-right: 4px;
}
.ach-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid #ffffff24;
    background: #111412;
    color: #6d736f;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: default;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
}
.ach-badge.unlocked {
    border-color: #b98cff70;
    background: #1a1428;
    color: #d9c2ff;
}
.ach-badge .ach-icon {
    width: 10px;
    height: 10px;
    flex: 0 0 auto;
}
.ach-badge.unlocked .ach-icon { color: #b98cff; }
.ach-badge.locked .ach-icon { color: #ffffff30; }

.ach-badge-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
}
.ach-badge-name {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    line-height: 1.15;
}
.ach-badge-desc {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: none;
    color: #ffffff55;
    line-height: 1.2;
}
.ach-badge.unlocked .ach-badge-desc {
    color: #b98cff99;
}

/* ── Тост достижения ── */
.ach-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 90;
    transform: translate(-50%, 20px);
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: min(92vw, 420px);
    padding: 12px 16px;
    border: 1px solid #b98cff70;
    background: #14101e;
    color: var(--paper);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
}
.ach-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}
.ach-toast .ach-toast-icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: #b98cff;
}
.ach-toast .ach-toast-text { min-width: 0; }
.ach-toast .ach-toast-label {
    display: block;
    color: #b98cff;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.ach-toast .ach-toast-name {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -.01em;
}
.ach-toast .ach-toast-desc {
    display: block;
    margin-top: 2px;
    color: #adb2ae;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .04em;
}

header {
    display: flex;
    align-items: center;              /* ← центрируем по вертикали */
    justify-content: space-between;
    padding: 30px 0;
    border-bottom: 1px solid #ffffff20;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .16em;
    line-height: 1;
    text-transform: uppercase;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;                     /* ← высота как у кнопок */
    line-height: 1;
}

.brand-mark {
    width: 10px;
    height: 10px;
    background: var(--acid);
    flex: 0 0 auto;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;                     /* ← та же высота */
}

.catalog-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;                     /* ← высота вместо padding */
    min-height: 0;                    /* ← сбрасываем min-height: 58px от общего button */
    margin: 0;                        /* ← сбрасываем margin-top: 38px от общего button */
    padding: 0 16px;
    border: 1px solid #ffffff40;
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .14em;
    line-height: 1;
    text-transform: uppercase;
    transition: background .2s ease, color .2s ease;
}
.catalog-btn:hover { background: var(--paper); color: var(--ink); transform: none; }



.ach-modal-title {
    display: block;
    padding: 9px 0 9px 2px;
    color: var(--paper);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
}

/* ── Список достижений ── */
.ach-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 0;
}
.ach-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid #ffffff14;
    background: #111412c0;
    transition: border-color .2s ease, background .2s ease;
}
.ach-item.unlocked {
    border-color: #b98cff55;
    background: #16121f;
}
.ach-item .ach-item-icon {
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    margin-top: 1px;
}
.ach-item.unlocked .ach-item-icon { color: #b98cff; }
.ach-item.locked  .ach-item-icon { color: #ffffff30; }

.ach-item-text { min-width: 0; flex: 1; }
.ach-item-name {
    display: block;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -.01em;
    color: var(--paper);
}
.ach-item.locked .ach-item-name { color: #6d736f; }

.ach-item-desc {
    display: block;
    margin-top: 3px;
    color: #adb2ae;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
}
.ach-item.locked .ach-item-desc { color: #5c6360; }

.ach-item-status {
    flex: 0 0 auto;
    align-self: center;
    color: #b98cff;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
}

.ach-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #ffffff14;
    background: #0b0d0c;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.ach-summary b { color: var(--paper); }

main {
    display: grid;
    flex: 1;
    align-content: center;
    justify-items: center;
    padding: 80px 0 100px;
    text-align: center;
}

button {
    display: inline-flex;
    min-height: 58px;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 38px;
    padding: 0 24px;
    border: 0;
    background: var(--acid);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .11em;
    text-transform: uppercase;
    transition: transform .2s ease, background .2s ease;
}
button:hover { transform: translateY(-3px); background: #d9d9d9; }
button:focus-visible { outline: 2px solid var(--paper); outline-offset: 5px; }
button .arrow { display: inline-flex; width: 16px; height: 16px; }
button .arrow svg { display: block; width: 100%; height: 100%; }

.quote-card {
    position: relative;
    width: min(100%, 760px);
    min-height: 180px;
    margin-top: 56px;
    padding: 34px 34px 30px;
    border: 1px solid #ffffff24;
    background: #111412e8;
    animation: card-in .9s ease both;
}
.quote-card::before {
    position: absolute;
    top: -36px;
    left: 50%;
    z-index: 1;
    width: 25px;
    height: 34px;
    clip-path: path("M 12.5 0 C 9 7, 1 18, 1 23 C 1 30, 6 34, 12.5 34 C 19 34, 24 30, 24 23 C 24 18, 16 7, 12.5 0 Z");
    background: var(--paper);
    content: "";
    opacity: 0;
    transform: translate(-50%, -20px) scale(.65,.8);
    pointer-events: none;
}
.quote-card::after {
    position: absolute;
    top: -3px;
    left: 50%;
    width: 150px;
    height: 48px;
    background: radial-gradient(circle at 13% 28%, #fff 0 2px, transparent 3px), radial-gradient(circle at 87% 25%, #fff 0 2px, transparent 3px), radial-gradient(circle at 28% 9%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 72% 7%, #fff 0 1.5px, transparent 2.5px), radial-gradient(ellipse at center, transparent 27%, #fff 29% 31%, transparent 33% 52%, #fff 54% 56%, transparent 58% 76%, #fff 78% 80%, transparent 82%);
    content: "";
    opacity: 0;
    transform: translate(-50%, -50%) scale(.15, .35);
    pointer-events: none;
}
.quote-card.dropping::before { animation: drop-in .72s cubic-bezier(.2,.7,.25,1) both; }
.quote-card.dropping::after  { animation: splash .55s .57s ease-out both; }
.quote-card.dropping .quote-text,
.quote-card.dropping .track,
.quote-card.dropping .album  { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }
.quote-card.dropping .listen-link { animation: reveal .55s 1s cubic-bezier(.2,.7,.2,1) both; }
.quote-card[hidden] { display: none; }

.quote-text {
    margin: 0 auto;
    font-size: clamp(22px, 4.2vw, 38px);
    font-weight: 800;
    letter-spacing: -.045em;
    line-height: 1.23;
}
.track {
    margin: 14px 0 0;
    color: var(--mint);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.track[hidden] { display: none; margin: 0; }

.album {
    margin: 6px 0 0;
    color: var(--mint);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.album[hidden] { display: none; margin: 0; }

.secret-mark {
    margin: 10px 0 0;
    color: #b98cff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .2em;
    text-transform: uppercase;
}
.secret-mark[hidden] { display: none; }

.listen-link {
    display: inline-flex;
    min-height: 42px;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
    padding: 0 16px;
    border: 1px solid #ffffff70;
    color: var(--paper);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .13em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background .2s ease, color .2s ease;
}
.listen-link:hover { background: var(--paper); color: var(--ink); }
.listen-link svg { width: 13px; height: 13px; }

.cat-listen {
    min-height: 32px;
    margin: 10px 12px 2px;
    padding: 0 12px;
    gap: 8px;
    font-size: 9px;
}
.cat-listen svg { width: 11px; height: 11px; }

/* ── Справка об альбоме (данные с Genius) ── */
.album-note {
    max-width: 560px;
    margin: 18px auto 0;
    color: #adb2ae;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.55;
}
.album-note[hidden] { display: none; }
.album-note + .listen-link { margin-top: 16px; }
.an-meta {
    display: block;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ffffff1a;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
}
.an-text { display: block; white-space: pre-line; }
.an-src {
    display: inline-block;
    margin-top: 8px;
    color: #6d736f;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .14em;
    text-decoration: none;
    text-transform: uppercase;
}
.an-src:hover { color: var(--paper); text-decoration: underline; }
.cat-album-info {
    max-width: none;
    margin: 10px 12px 0;
    padding: 10px 12px;
    border: 1px solid #ffffff14;
    background: #0b0d0c;
    font-size: 12px;
    text-align: left;
}
.quote-card.dropping .release-date { animation: reveal .55s .9s cubic-bezier(.2,.7,.2,1) both; }
.release-date {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.release-date[hidden] { display: none; margin: 0; }
.release-date + .listen-link { margin-top: 16px; }
.cat-release-date {
    margin: 10px 12px 0;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
}

.card-cover {
    display: block;
    width: 104px;
    height: 104px;
    margin: 12px auto 0;
    object-fit: cover;
    border: 1px solid #ffffff24;
    background: #1a1d1b;
}
.card-cover[hidden] { display: none; }
.quote-card.dropping .card-cover { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }
.quote-card.dropping .feats { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }

.feats {
    margin: 8px 0 0;
    color: #adb2ae;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
}
.feats[hidden] { display: none; margin: 0; }
.feats b { color: var(--paper); }
.badge {
    display: inline-block;
    margin-right: 6px;
    padding: 2px 6px;
    border: 1px solid #ffffff50;
    color: var(--paper);
    font-size: 9px;
    letter-spacing: .14em;
}

.counter {
    margin-top: 18px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.counter strong { color: var(--paper); }
.counter.limit  { color: #ff6b6b; }

.reset-timer {
    margin-top: 6px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.reset-timer strong {
    color: var(--paper);
    font-variant-numeric: tabular-nums;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #000000cc;
    backdrop-filter: blur(4px);
    animation: fade-in .2s ease both;
}
.modal[hidden] { display: none; }
.modal-box {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(100%, 860px);
    max-height: 88svh;
    border: 1px solid #ffffff30;
    background: #0e100f;
}

.cat-text-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.cat-note {
    display: inline-block;
    margin-top: 4px;
    color: #b98cff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1.4;
    text-transform: none;
    font-style: italic;
}

/* Большая кнопка: старый размер, оформление как у .catalog-btn */
#quote-button {
    height: auto;
    min-height: 58px;
    margin-top: 38px;
    padding: 0 24px;
    gap: 14px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .11em;
}

/* ── Голосование: цитата дня ── */
.qotd {
    width: min(100%, 760px);
    margin-bottom: 44px;
    padding: 22px 28px 20px;
    border: 1px solid #ffffff24;
    background: #111412e8;
}
.qotd[hidden] { display: none; }
.qotd-label {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.qotd-text {
    margin: 0 auto;
    font-size: clamp(16px, 2.6vw, 22px);
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1.3;
}
.qotd-meta {
    margin: 12px 0 0;
    color: var(--mint);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.qotd-meta span { color: var(--muted); }

.qotd .catalog-btn { margin-top: 18px; }
.qotd-text[hidden], .qotd-meta[hidden] { display: none; }

.vote-hint {
    margin: 0 0 10px;
    padding: 0 2px;
    color: #adb2ae;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.45;
}
.vote-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border: 1px solid #ffffff14;
    background: #111412c0;
    text-align: left;
    transition: border-color .2s ease, background .2s ease;
}
.vote-item.mine { border-color: #ffffff70; background: #1a1d1b; }
.vote-item-text { min-width: 0; flex: 1; }
.vote-item-quote {
    display: block;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.35;
}
.vote-item-meta {
    display: block;
    margin-top: 6px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
}
.vote-item-side {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
}
.vote-item-count {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
}
.vote-item-count b { color: var(--paper); font-size: 14px; }
.vote-pick {
    min-height: 34px;
    margin: 0;
    padding: 0 12px;
    border: 1px solid #ffffff70;
    background: transparent;
    color: var(--paper);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .13em;
}
.vote-pick:hover { background: var(--paper); color: var(--ink); transform: none; }
.vote-pick:disabled { opacity: .4; cursor: default; }
.vote-pick:disabled:hover { background: transparent; color: var(--paper); }
.vote-item.mine .vote-pick:disabled { opacity: 1; background: var(--paper); color: var(--ink); }
@media (max-width: 560px) {
    .vote-item { flex-direction: column; align-items: stretch; }
    .vote-item-side { flex-direction: row; align-items: center; justify-content: space-between; }
}

#quote-button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}
#quote-button:disabled:hover {
    background: transparent;
    color: var(--paper);
    transform: none;
}

.modal-search {
    position: relative;
    padding: 8px 44px 8px 12px;
}
.modal-search input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ffffff30;
    background: #080a09;
    color: var(--paper);
    font: inherit;
    font-size: 13px;
    outline: none;
}
.modal-search input:focus { border-color: #ffffff70; }

.modal-close {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    z-index: 5;
    width: 30px;
    height: 30px;
    min-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #ffffff30;
    background: #0e100f;
    color: var(--paper);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    margin: 0;
    padding: 0;
}
.modal-close:hover { background: var(--paper); color: var(--ink); transform: translateY(-50%); }

.modal-body {
    overflow-y: auto;
    padding: 4px 12px 14px;
}

.album-card {
    margin-bottom: 6px;
    border: 1px solid #ffffff14;
    background: #111412c0;
    transition: border-color .2s ease;
}
.album-card.open { border-color: #ffffff35; }

.album-card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    font: inherit;
    text-align: left;
    transition: background .2s ease;
    min-height: 0;
    margin: 0;
    text-transform: none;
    letter-spacing: normal;
    line-height: normal;
}
.album-card-head:hover { background: #ffffff0a; }
.album-card-head:focus-visible { outline: 2px solid var(--paper); outline-offset: -2px; }

.album-cover-wrap {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 1px solid #ffffff1a;
    background: #1a1d1b;
    overflow: hidden;
}
.album-cover-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.album-cover-wrap.ph {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff40;
    font-size: 14px;
}

.album-info { flex: 1; min-width: 0; }
.album-title {
    margin: 0;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.album-stats {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
}
.album-stats b { color: var(--paper); }

.album-chevron {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--muted);
    transition: transform .25s ease, color .2s ease;
}
.album-card.open .album-chevron {
    transform: rotate(180deg);
    color: var(--paper);
}

.album-tracks {
    overflow: hidden;
    max-height: 0;
    transition: max-height .35s ease;
}
.album-card.open .album-tracks {
    max-height: 4000px;
}

.track-group { padding: 8px 12px 4px; }
.track-group + .track-group { border-top: 1px solid #ffffff0d; }

.track-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
}
.track-cover {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    object-fit: cover;
    border: 1px solid #ffffff1a;
    background: #1a1d1b;
}
.track-cover.ph {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff40;
    font-size: 12px;
}
.track-head-info { min-width: 0; }
.track-title {
    margin: 0;
    color: var(--mint);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.track-feats {
    margin: 2px 0 0;
    color: #adb2ae;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
}
.track-feats b { color: var(--paper); }
.track-feats .badge {
    display: inline-block;
    margin-right: 4px;
    padding: 1px 5px;
    border: 1px solid #ffffff50;
    color: var(--paper);
    font-size: 8px;
    letter-spacing: .12em;
}

.cat-item {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    color: #c9ccc8;
    font-size: 13px;
    line-height: 1.5;
}
.cat-item .dot {
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    margin-top: 8px;
    background: #ffffff40;
}
.cat-item.seen .dot { background: #4caf50; }
.cat-item.seen { color: #6d736f; }

.cat-item.locked .cat-body {
    position: relative;
    user-select: none;
    flex: 1;
    min-width: 0;
}
.cat-item.locked .cat-text {
    filter: blur(4px);
    opacity: .55;
}
.cat-item.locked .cat-mask {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: linear-gradient(90deg, #0e100f 0%, #0e100fee 35%, #0e100fee 65%, #0e100f 100%);
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    pointer-events: none;
}
.cat-item.locked .cat-mask svg { width: 10px; height: 10px; }

@keyframes card-in {
    from { opacity: 0; transform: translateY(-8px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes drop-in {
    0%   { opacity: 0; transform: translate(-50%, -34px) scale(.65,.8); }
    12%  { opacity: 1; }
    70%  { opacity: 1; transform: translate(-50%, 44px) scale(.9,1.15); }
    82%  { opacity: 1; transform: translate(-50%, 35px) scale(1.1,.8); }
    100% { opacity: 0; transform: translate(-50%, 40px) scale(1.1,.8); }
}
@keyframes splash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.15, .35); }
    14%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1, 1); }
}
@keyframes reveal {
    from { opacity: 0; transform: translateY(14px); filter: blur(5px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@media (max-width: 560px) {
    .page { width: min(100% - 32px, 1280px); }
    header { padding: 22px 0; font-size: 10px; }
    main   { padding: 66px 0 76px; }
    .quote-card { min-height: 0; padding: 28px 20px 25px; margin-top: 42px; }
    .modal { padding: 12px; }
    .modal-body { padding: 4px 10px 12px; }
    .track-group { padding: 8px 10px 4px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<div class="page">

        <p class="reset-timer" id="reset-timer"></p>
        <section class="quote-card" id="quote-card" aria-live="polite" aria-atomic="true" hidden>
            <p class="quote-text" id="quote-text"></p>

</div>

function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function parseTrack(raw) {
    const m = raw.match(/\s*[\(\[]\s*(?:feat\.?|ft\.?|при уч\.?|совм\.? с)\s+([^)\]]+)[\)\]]\s*$/i);
    if (!m) return { title: raw, feats: [] };
    const feats = m[1].split(/\s*(?:,|&|×|\s+x\s+|\s+и\s+|\s+and\s+)\s*/i).map(x => x.trim()).filter(Boolean);
    return { title: raw.slice(0, m.index).trim(), feats };
}
function shortName(n) {

    return s.replace(/\s*[\(\[][^)\]]*[\)\]]\s*$/, '').trim() || s;
}
function trackMeta(quote) {
    const parsed = parseTrack(quote.track);
    const info = TRACK_INFO[quote.album + '|' + quote.track] || {};
    const isFit = quote.album.startsWith('fit_');
    const feats = [...new Set((info.feats && info.feats.length ? info.feats : parsed.feats).map(shortName))].filter(n => n && !ARTIST_RE.test(n));
    return { title: parsed.title, feats, main: shortName(info.main || ''), isFit };
}
function featsHtml(quote) {

}

const EN_MONTHS = { january: 'января', february: 'февраля', march: 'марта', april: 'апреля', may: 'мая', june: 'июня',
    july: 'июля', august: 'августа', september: 'сентября', october: 'октября', november: 'ноября', december: 'декабря' };

function ruDate(d) {

    if (m && EN_MONTHS[m[1].toLowerCase()]) return m[2] + ' ' + EN_MONTHS[m[1].toLowerCase()] + ' ' + m[3];

function jsonp(url, timeout = 6000) {
    return new Promise((resolve, reject) => {
        const cb = '__jp' + Math.random().toString(36).slice(2);
        const el = document.createElement('script');
        const done = (fn, v) => { delete window[cb]; el.remove(); clearTimeout(t); fn(v); };
        const t = setTimeout(() => done(reject, new Error('timeout')), timeout);
        window[cb] = data => done(resolve, data);
        el.onerror = () => done(reject, new Error('error'));
        el.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
        document.head.appendChild(el);
    });
}
async function liveItunes(term) {
    const r = await fetch('https://itunes.apple.com/search?entity=song&limit=8&term=' + encodeURIComponent('mzlff ' + term));
    const j = await r.json();
    const hit = (j.results || []).find(x => ARTIST_RE.test(x.artistName || '') && x.artworkUrl100);
    return hit ? hit.artworkUrl100.replace(/\d+x\d+bb/, '600x600bb') : '';
}
async function liveDeezer(term) {
    const j = await jsonp('https://api.deezer.com/search?q=' + encodeURIComponent('artist:"mzlff" ' + term));
    const hit = (j.data || []).find(x => x.album && x.album.cover_big);
    return hit ? hit.album.cover_big : '';
}
let liveQueue = Promise.resolve();
const inflight = {};
const LOCAL_DIR = 'covers/';
const LOCAL_EXTS = ['png', 'jpg', 'jpeg', 'webp'];
const localCache = {};
function probeImg(url) {
    return new Promise(resolve => {
        const im = new Image();
        im.onload = () => resolve(true);
        im.onerror = () => resolve(false);
        im.src = url;
    });
}
function localCover(key) {
    if (key in localCache) return localCache[key];
    const cands = [];
    const known = COVERS[key];
    if (known && !/^(https?:)?\/\//i.test(known)) cands.push(known);
    for (const ext of LOCAL_EXTS) {
        const p = LOCAL_DIR + key + '.' + ext;
        if (!cands.includes(p)) cands.push(p);
    }
    return localCache[key] = (async () => {
        for (const c of cands) if (await probeImg(c)) return c;
        return '';
    })();
}
function resolveCover(quote) {
    const key = quote.album;
    const a = albums[key] || {};
    if (a.cover) return Promise.resolve(a.cover);
    return localCover(key).then(local => local || resolveRemoteCover(quote));
}
function resolveRemoteCover(quote) {
    const key = quote.album;
    const a = albums[key] || {};
    const known = (/^(https?:)?\/\//i.test(COVERS[key] || '') ? COVERS[key] : '') || coverCache[key];
    if (known) return Promise.resolve(known);
    if (coverCache[key] === '') return Promise.resolve('');
    if (inflight[key]) return inflight[key];
    const term = (a.title || parseTrack(quote.track).title).replace(/\s*\(.*?\)\s*/g, ' ').trim();
    inflight[key] = liveQueue = liveQueue.then(async () => {
        let url = '';
        for (const fn of [liveItunes, liveDeezer]) {
            try { url = await fn(term); } catch (e) {}
            if (url) break;
        }
        coverCache[key] = url;
        saveCoverCache();
        await new Promise(r => setTimeout(r, 350));
        return url;
    });
    return inflight[key];
}
function setImg(img, url) {
    if (!url) { img.hidden = true; return; }
    img.onerror = () => { img.hidden = true; };
    img.onload = () => { img.hidden = false; };

const DAILY_LIMIT = 20;
const LS_LIMIT = 'mzlff:limit';
const LS_SEEN  = 'mzlff:seen';

function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadLimitState() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_LIMIT) || 'null');
        if (raw && raw.date === todayKey()) return raw;
    } catch (e) {}
    return { date: todayKey(), count: 0 };
}
function saveLimitState(s) { try { localStorage.setItem(LS_LIMIT, JSON.stringify(s)); } catch (e) {} }
// Открытые цитаты хранятся по «ключу» цитаты (альбом | трек | текст), а не по номеру в списке:
// так добавление новых треков в любое место списка не сдвигает прогресс старых.
function seenKey(q) { return q.album + '|' + q.track + '|' + q.text; }
function loadSeen() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_SEEN) || 'null');
        if (raw && raw.v === 2 && Array.isArray(raw.keys)) {
            const byKey = new Map();
            quotes.forEach((q, i) => byKey.set(seenKey(q), i));
            secretQuotes.forEach((q, i) => byKey.set(seenKey(q), quotes.length + i));
            const indices = [];
            raw.keys.forEach(k => { if (byKey.has(k)) indices.push(byKey.get(k)); });
            return { date: todayKey(), indices };
        }
    } catch (e) {}
    return { date: todayKey(), indices: [] };
}
function saveSeen(s) {
    try {
        const keys = s.indices.map(i => seenKey(i < quotes.length ? quotes[i] : secretQuotes[i - quotes.length]));
        localStorage.setItem(LS_SEEN, JSON.stringify({ v: 2, keys }));
    } catch (e) {}
}

let limitState = loadLimitState();
let seenState  = loadSeen();


// ==========================================
// ПРОВЕРКА ДОСТИЖЕНИЙ
// ==========================================
function getAlbumQuoteIndices(albumKey) {
    const indices = [];
    quotes.forEach((q, i) => { if (q.album === albumKey) indices.push(i); });
    secretQuotes.forEach((q, i) => { if (q.album === albumKey) indices.push(quotes.length + i); });
    return indices;
}

function unlock(key) {
    const ach = achievements[key];
    if (!ach || unlockedAchievements[key]) return false;
    unlockedAchievements[key] = true;
    showAchievementToast(ach);
    return true;
}

const _idxCache = {};
function indicesWhere(key, pred) {
    if (!_idxCache[key]) {
        const r = [];
        quotes.forEach((q, i) => { if (pred(q)) r.push(i); });
        secretQuotes.forEach((q, i) => { if (pred(q)) r.push(quotes.length + i); });
        _idxCache[key] = r;
    }
    return _idxCache[key];
}
function quoteByIndex(i) { return i < quotes.length ? quotes[i] : secretQuotes[i - quotes.length]; }

function checkAchievements() {
    const seenSet = new Set(seenState.indices);
    let anyNew = false;

    // ── Все цитаты альбома ──
    for (const albumKey of Object.keys(achievements)) {
        if (unlockedAchievements[albumKey]) continue;
        if (!getAlbumQuoteIndices(albumKey).length) continue;
        const indices = getAlbumQuoteIndices(albumKey);
        if (indices.every(i => seenSet.has(i))) {
            if (unlock(albumKey)) anyNew = true;
        }
    }

    // ── Первая цитата ──
    if (seenState.indices.length >= 1 && unlock('first_quote')) anyNew = true;

    // ── Серии ──
    const total = seenState.indices.length;
    if (total >= 10  && unlock('streak_10'))  anyNew = true;
    if (total >= 50  && unlock('streak_50'))  anyNew = true;
    if (total >= 100 && unlock('streak_100')) anyNew = true;
    if (total >= 200 && unlock('streak_200')) anyNew = true;

    // ── Полный день ──
    if (limitState.count >= DAILY_LIMIT && unlock('daily_perfect')) anyNew = true;

    // ── Половины альбомов ──
    const halves = {
        svetlayastorona_half: 'svetlayastorona',
        PHANTASMAGORIA_half:  'PHANTASMAGORIA',
        adhd_half:            'ADHD',
        HOLOD_half:           'HOLOD',
        mayak_half:           'MAYAK',
        POTERYAN_half:        'POTERYAN',
        cosmoc_half:          'COSMOC',
        AKUST_half:           'AKUST',
        anemone_half:         'anemone',
        nichego_half:         'nichego',
    };
    for (const [achKey, albumKey] of Object.entries(halves)) {
        if (unlockedAchievements[achKey]) continue;
        const idx = getAlbumQuoteIndices(albumKey);
        if (!idx.length) continue;
        const seenCount = idx.filter(i => seenSet.has(i)).length;
        if (seenCount >= Math.ceil(idx.length / 2)) {
            if (unlock(achKey)) anyNew = true;
        }
    }

    // ── Синглы ──
    const singleIdx = indicesWhere('singles', q => q.album.startsWith('singl_'));
    const singleSeen = singleIdx.filter(i => seenSet.has(i));
    if (singleSeen.length >= 1 && unlock('singles_first')) anyNew = true;
    if (new Set(singleSeen.map(i => quoteByIndex(i).album)).size >= 10 && unlock('singles_10')) anyNew = true;
    if (singleIdx.length && singleSeen.length >= Math.ceil(singleIdx.length / 2) && unlock('singles_half')) anyNew = true;
    if (singleIdx.length && singleSeen.length === singleIdx.length && unlock('singles_all')) anyNew = true;

    // ── Илюха реп ──
    const ilyuhaIdx = indicesWhere('ilyuha', q => q.album !== 'secret' && /илюх/i.test(q.text));
    const ilyuhaSeen = ilyuhaIdx.filter(i => seenSet.has(i)).length;
    if (ilyuhaSeen >= 1 && unlock('ilyuha_first')) anyNew = true;
    if (ilyuhaIdx.length && ilyuhaSeen === ilyuhaIdx.length && unlock('ilyuha_all')) anyNew = true;
    const pozhIdx = indicesWhere('pozharnik', q => q.album === 'singl_pozharnik');
    if (pozhIdx.length && pozhIdx.every(i => seenSet.has(i)) && unlock('pozharnik_all')) anyNew = true;

    // ── Фиты (гости на треках mzlff и mzlff в гостях) ──
    const featIdx = indicesWhere('feats', q => q.album !== 'secret' && (q.album.startsWith('fit_') || trackMeta(q).feats.length > 0));
    const featSeen = featIdx.filter(i => seenSet.has(i)).length;
    if (featSeen >= 1 && unlock('feat_first')) anyNew = true;
    if (featIdx.length && featSeen >= Math.ceil(featIdx.length / 2) && unlock('feat_half')) anyNew = true;
    if (featIdx.length && featSeen === featIdx.length && unlock('feat_all')) anyNew = true;
    const byGuest = { guest_sted: 'STED.D', guest_kskh: 'ксх', guest_iztolpy: 'ИзТолпы' };
    for (const [achKey, name] of Object.entries(byGuest)) {
        if (unlockedAchievements[achKey]) continue;
        const idx = indicesWhere('guest:' + name, q => !q.album.startsWith('fit_') && trackMeta(q).feats.some(n => n.toLowerCase() === name.toLowerCase()));
        if (idx.length && idx.every(i => seenSet.has(i)) && unlock(achKey)) anyNew = true;
    }

    // ── Время суток ──
    const hour = new Date().getHours();
    const minute = new Date().getMinutes();
    if (hour >= 0 && hour < 5 && unlock('night_owl')) anyNew = true;
    if (hour >= 5 && hour < 9 && unlock('early_bird')) anyNew = true;
    if (hour === 0 && minute === 0 && unlock('midnight')) anyNew = true;

    if (anyNew) saveAchievements(unlockedAchievements);
}

function updateCounter() {
    const remainingDaily = Math.max(0, DAILY_LIMIT - limitState.count);
    const totalQuotes    = quotes.length + secretQuotes.length;
    const remainingAll   = Math.max(0, totalQuotes - seenState.indices.length);

    counterEl.classList.toggle('limit', remainingDaily === 0 || remainingAll === 0);

function msUntilReset() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
    return next - now;
}

function updateResetTimer() {
    const ms = msUntilReset();
    const totalSec = Math.max(0, Math.floor(ms / 1000));

    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;

    const pad = n => String(n).padStart(2, '0');

    if (totalSec <= 0) {
        resetTimerEl.innerHTML = 'Обновление…';
    } else {
        resetTimerEl.innerHTML =
            `Обновление через <strong>${pad(h)}:${pad(m)}:${pad(s)}</strong>`;
    }
}

const SECRET_CHANCE = 0.03; // 3% шанс, что попадётся тайная

function getQuote(globalIndex) {
    if (globalIndex < quotes.length) return quotes[globalIndex];
    return secretQuotes[globalIndex - quotes.length];
}

function pickQuoteIndex() {
    const secretOffset = quotes.length;

    const usedRegular = new Set(seenState.indices.filter(i => i < secretOffset));
    const availableRegular = [];
    for (let i = 0; i < quotes.length; i++) {
        if (!usedRegular.has(i)) availableRegular.push(i);
    }

    const usedSecret = new Set(seenState.indices.filter(i => i >= secretOffset));
    const availableSecret = [];
    for (let i = 0; i < secretQuotes.length; i++) {
        const g = secretOffset + i;
        if (!usedSecret.has(g)) availableSecret.push(g);
    }

    if (availableRegular.length === 0 && availableSecret.length === 0) return -1;

    if (availableSecret.length > 0 && Math.random() < SECRET_CHANCE) {
        return availableSecret[Math.floor(Math.random() * availableSecret.length)];
    }

    if (availableRegular.length > 0) {
        return availableRegular[Math.floor(Math.random() * availableRegular.length)];
    }

    return availableSecret[Math.floor(Math.random() * availableSecret.length)];
}

let openAlbumKey = null;

function buildCatalog() {
    const map = new Map();

    quotes.forEach((quote, i) => {
        if (!map.has(quote.album)) map.set(quote.album, new Map());
        const tracks = map.get(quote.album);
        if (!tracks.has(quote.track)) tracks.set(quote.track, []);
        tracks.get(quote.track).push(i);
    });

    secretQuotes.forEach((quote, i) => {
        const globalIdx = quotes.length + i;
        if (!map.has(quote.album)) map.set(quote.album, new Map());
        const tracks = map.get(quote.album);
        if (!tracks.has(quote.track)) tracks.set(quote.track, []);
        tracks.get(quote.track).push(globalIdx);
    });

    return map;
}
function orderedAlbumKeys(catalog) {
    const known = Object.keys(albums).filter(k => catalog.has(k));
    const rest  = [...catalog.keys()].filter(k => !known.includes(k));
    return [...known, ...rest];
}
function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
}

// Тайные цитаты в каталоге вообще не показываются, пока не открыты
// Нормализация для поиска: ё→е и падежи «Илюха реп» («илюху репа», «илюхи репа» → «илюх реп»)
function normSearch(str) {
    return String(str || '').toLowerCase().replace(/ё/g, 'е')
        .replace(/илюх[а-я]*([\s-]+реп[а-я]*)?/g, (m, r) => r ? 'илюх реп' : 'илюх');
}

function isVisibleInCatalog(i) {
    return i < quotes.length || seenState.indices.includes(i);
}

function renderCatalog(filter = '') {
    const catalog = buildCatalog();
    const q = normSearch(filter.trim());
    let html = '';
    let shownAlbums = 0;

    for (const albumKey of orderedAlbumKeys(catalog)) {
        const tracks = catalog.get(albumKey);
        const firstTrack = [...tracks.keys()][0];
        const title = albumLabel({ album: albumKey, track: firstTrack });

        let totalQuotes = 0, seenCount = 0;
        const matchedTracks = new Map();

        for (const [track, allIndices] of tracks) {
            const indices = allIndices.filter(isVisibleInCatalog);
            if (!indices.length) continue;
            const meta = trackMeta({ album: albumKey, track });
            const hay = normSearch(meta.title + ' ' + meta.feats.join(' ') + ' ' + meta.main);
            const albumHay = normSearch(title);
            const trackMatches = !q || hay.includes(q) || albumHay.includes(q);
            const matchedIndices = indices.filter(i => !q || trackMatches || normSearch(getQuote(i).text).includes(q));
            if (matchedIndices.length === 0) continue;
            matchedTracks.set(track, matchedIndices);
            totalQuotes += matchedIndices.length;
            seenCount += matchedIndices.filter(i => seenState.indices.includes(i)).length;
        }
        if (matchedTracks.size === 0) continue;
        shownAlbums++;
        const isOpen = openAlbumKey === albumKey;
        const coverHtml = `<div class="album-cover-wrap ph" data-cover-album="${esc(albumKey)}">♪</div>`;

        html += `<div class="album-card${isOpen ? ' open' : ''}" data-album="${esc(albumKey)}">
            <button class="album-card-head" type="button" aria-expanded="${isOpen}">
                ${coverHtml}
                <div class="album-info">
                    <p class="album-title">${esc(title)}</p>
                    <p class="album-stats">${matchedTracks.size} ${plural(matchedTracks.size,'трек','трека','треков')} · ${albumKey === 'secret'
                        ? `<b>${seenCount}</b> ${plural(seenCount,'цитата','цитаты','цитат')} открыто`
                        : `<b>${seenCount}</b>/${totalQuotes} ${plural(totalQuotes,'цитата','цитаты','цитат')} открыто`}</p>
                </div>
                <svg class="album-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
                </svg>
            </button>
            <div class="album-tracks">
                ${releaseDateText(albumKey) ? `<p class="cat-release-date">Релиз: ${esc(releaseDateText(albumKey))}</p>` : ''}
                ${albumInfoHtml(albumKey) ? `<div class="album-note cat-album-info">${albumInfoHtml(albumKey)}</div>` : ''}
                ${albumUrl(albumKey) ? `<a class="listen-link cat-listen" href="${esc(albumUrl(albumKey))}" target="_blank" rel="noopener noreferrer">
                    <span>Слушать</span>
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
                    </svg>
                </a>` : ''}
                ${[...matchedTracks].map(([track, indices]) => renderTrackGroup(albumKey, track, indices)).join('')}
            </div>
        </div>`;
    }
    if (shownAlbums === 0) {
        catalogBody.innerHTML = '<p style="color:#858585;padding:24px 0;text-align:center">Ничего не найдено.</p>';
        return;
    }
    catalogBody.innerHTML = html;

    catalogBody.querySelectorAll('.album-card-head').forEach(btn => {
        btn.addEventListener('click', () => {
            const cardEl = btn.closest('.album-card');
            const key = cardEl.dataset.album;
            const willOpen = !cardEl.classList.contains('open');
            catalogBody.querySelectorAll('.album-card').forEach(c => {
                c.classList.remove('open');
                c.querySelector('.album-card-head').setAttribute('aria-expanded', 'false');
            });
            if (willOpen) {
                cardEl.classList.add('open');
                btn.setAttribute('aria-expanded', 'true');
                openAlbumKey = key;
            } else {
                openAlbumKey = null;
            }
        });
    });
    hydrateCatalogCovers();
}

function renderTrackGroup(albumKey, track, indices) {
    const meta = trackMeta({ album: albumKey, track });
    const fh = featsHtml({ album: albumKey, track });
    const albumText = albumLabel({ album: albumKey, track });
    const sameName = meta.title === albumText && meta.title !== 'Космоцветок';
    const shownName = sameName ? albumText : meta.title;
    const coverHtml = `<div class="track-cover ph" data-cover-album="${esc(albumKey)}" data-cover-track="${esc(track)}">♪</div>`;

    const rows = indices.map(i => {
        const quote = getQuote(i);
        const seen = seenState.indices.includes(i);
        const isSecret = i >= quotes.length;
        const secretClass = isSecret ? ' secret' : '';
        const noteHtml = isSecret && quote.note
            ? `<span class="cat-note">${esc(quote.note)}</span>`
            : '';

        if (seen) {
            return `<div class="cat-item seen${secretClass}">
                <span class="dot"></span>
                <span class="cat-text-wrap">
                    <span>«${esc(quote.text)}»</span>
                    ${noteHtml}
                </span>
            </div>`;
        }
        return `<div class="cat-item locked${secretClass}">
            <span class="dot"></span>
            <span class="cat-body">
                <span class="cat-text">«${esc(quote.text)}»</span>
                <span class="cat-mask">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M4 7V5a4 4 0 118 0v2M3 7h10v7H3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                    Закрыто
                </span>
                ${noteHtml}
            </span>
        </div>`;
    }).join('');

    return `<div class="track-group">
        <div class="track-head">
            ${coverHtml}
            <div class="track-head-info">
                <p class="track-title">${esc(shownName)}</p>
                ${fh ? `<p class="track-feats">${fh}</p>` : ''}
            </div>
        </div>
        ${rows}
    </div>`;
}

let coverObserver = null;
function hydrateCatalogCovers() {
    if (coverObserver) coverObserver.disconnect();
    coverObserver = new IntersectionObserver(entries => {
        for (const en of entries) {
            if (!en.isIntersecting) continue;
            const el = en.target;
            coverObserver.unobserve(el);

            if (el.hasAttribute('data-cover-track')) {
                const albumKey = el.dataset.coverAlbum;
                const track    = el.dataset.coverTrack;
                resolveCover({ album: albumKey, track }).then(url => {
                    if (!url) return;
                    const img = document.createElement('img');
                    img.className = 'track-cover';
                    img.alt = ''; img.referrerPolicy = 'no-referrer';
                    img.onload = () => el.replaceWith(img);
                    img.src = url;
                });
                continue;
            }

            if (el.classList.contains('album-cover-wrap')) {
                const albumKey = el.dataset.coverAlbum;
                if (!albumKey) continue;
                const first = quotes.find(q => q.album === albumKey)
                    || secretQuotes.find(q => q.album === albumKey);
                if (!first) continue;
                resolveCover(first).then(url => {
                    if (!url) return;
                    const img = document.createElement('img');
                    img.alt = ''; img.referrerPolicy = 'no-referrer';
                    img.onload = () => {
                        el.innerHTML = '';
                        el.classList.remove('ph');
                        el.appendChild(img);
                    };
                    img.src = url;
                });
            }
        }
    }, { root: catalogBody, rootMargin: '200px' });

    catalogBody.querySelectorAll('.album-card').forEach(el => coverObserver.observe(el));
    catalogBody.querySelectorAll('[data-cover-track]').forEach(el => coverObserver.observe(el));
    catalogBody.querySelectorAll('.album-cover-wrap[data-cover-album]').forEach(el => coverObserver.observe(el));
}

function openCatalog() {
    openAlbumKey = null;
    renderCatalog('');
    catalogSearch.value = '';
    catalogModal.hidden = false;
    document.body.style.overflow = 'hidden';
    checkAchievements();

}

function quoteId(q) {
    let h = 5381;
    for (let i = 0; i < q.text.length; i++) h = ((h * 33) ^ q.text.charCodeAt(i)) >>> 0;
    return h.toString(36);
}
const idToQuote = {};
const candidatePool = [];
quotes.forEach(q => {
    const id = quoteId(q);
    if (!idToQuote[id]) { idToQuote[id] = q; candidatePool.push({ id, q }); }
});
candidatePool.sort((a, b) => a.id < b.id ? -1 : 1);

// одинаковый набор из 8 цитат у всех посетителей: выбор зависит только от даты
function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
    return () => {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}
function candidatesFor(day) {
    const rnd = mulberry32(xmur3('mzlff:' + day)());
    const arr = candidatePool.slice();
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.slice(0, VOTE_COUNT);
}

function getClientId() {
    try {
        let id = localStorage.getItem('mzlff:cid');
        if (!id) {
            id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
            localStorage.setItem('mzlff:cid', id);
        }
        return id;
    } catch (e) { return 'anon-' + Math.random().toString(36).slice(2, 12); }
}
const CLIENT_ID = getClientId();

// ── журнал моих голосов и достижения за голосование ──
const LS_VOTELOG = 'mzlff:votelog';   // { 'YYYY-MM-DD': { id, first?, result? } }
function loadVoteLog() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_VOTELOG) || 'null');
        if (raw && typeof raw === 'object') return raw;
    } catch (e) {}
    return {};
}
function saveVoteLog() { try { localStorage.setItem(LS_VOTELOG, JSON.stringify(voteLog)); } catch (e) {} }
let voteLog = loadVoteLog();

function voteUnlock(key) {
    if (unlock(key)) saveAchievements(unlockedAchievements);
}
function dayDiff(a, b) {
    const t = d => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd); };
    return Math.round((t(b) - t(a)) / 86400000);
}
function evaluateVoteAchievements() {
    const days = Object.keys(voteLog).sort();
    if (days.length >= 1)  voteUnlock('vote_first');
    if (days.length >= 10) voteUnlock('vote_10');
    if (days.some(d => voteLog[d].first)) voteUnlock('vote_pioneer');

    let run = days.length ? 1 : 0, best = run;
    for (let i = 1; i < days.length; i++) {
        run = dayDiff(days[i - 1], days[i]) === 1 ? run + 1 : 1;
        if (run > best) best = run;
    }
    if (best >= 3) voteUnlock('vote_streak_3');

    const wins = days.filter(d => voteLog[d].result === 'win').length;
    if (wins >= 1) voteUnlock('vote_winner');
    if (wins >= 3) voteUnlock('vote_winner_3');
    if (days.some(d => voteLog[d].result === 'lonely')) voteUnlock('vote_lonely');
}
function recordVote(day, id, first) {
    if (!voteLog[day]) voteLog[day] = { id };
    if (first) voteLog[day].first = true;
    saveVoteLog();
    evaluateVoteAchievements();
}
// узнаём итоги прошедших дней, в которых я голосовал
async function resolveVoteResults() {
    if (!voteData) return;
    const today = voteData.day;
    let changed = false;
    for (const day of Object.keys(voteLog)) {
        const entry = voteLog[day];
        if (entry.result || day >= today || dayDiff(day, today) > 30) continue;
        try {
            const r = await fetch(VOTE_API + '?result=' + day, { cache: 'no-store' });
            if (!r.ok) continue;
            const { top } = await r.json();
            const ids = new Set(candidatesFor(day).map(c => c.id));
            const winner = (top || []).find(x => ids.has(x.id));
            if (winner && winner.id === entry.id) entry.result = 'win';
            else {
                const mine = (top || []).find(x => x.id === entry.id);
                entry.result = (mine && mine.votes === 1) ? 'lonely' : 'lose';
            }
            changed = true;
        } catch (e) {}
    }
    if (changed) { saveVoteLog(); evaluateVoteAchievements(); }
}

let voteData = null;   // ответ сервера
let voteBusy = false;

function placeOf(q) {
    const t = trackMeta(q).title, a = albumLabel(q);
    return t === a ? a : t + ' · ' + a;
}

function renderQotd() {
    const d = voteData;
    // цитата дня = победитель вчерашнего голосования среди вчерашних 8 кандидатов
    const yIds = new Set(candidatesFor(d.yesterday.day).map(c => c.id));
    let row = (d.yesterday.top || []).find(r => yIds.has(r.id));
    let label = 'Цитата дня';
    if (!row) {
        const tIds = new Set(candidatesFor(d.day).map(c => c.id));
        row = (d.today || []).find(r => tIds.has(r.id));
        label = 'Сейчас лидирует';
    }
    if (row) {
        const q = idToQuote[row.id];
        qotdLabel.textContent = label;
        qotdText.textContent = '«' + q.text + '»';
        qotdText.hidden = false;
        qotdMeta.innerHTML = esc(placeOf(q)) + ' <span>— ' + row.votes + ' ' + plural(row.votes, 'голос', 'голоса', 'голосов') + '</span>';
        qotdMeta.hidden = false;
    } else {
        qotdLabel.textContent = 'Цитата дня';
        qotdText.textContent = 'Пока не выбрана — проголосуй за любую из сегодняшних 8 цитат.';
        qotdText.hidden = false;
        qotdMeta.hidden = true;
    }
    qotdEl.hidden = false;
}

function renderVoteList() {
    const d = voteData;
    if (!d) return;
    const counts = {};
    (d.today || []).forEach(r => { counts[r.id] = r.votes; });
    const cands = candidatesFor(d.day);
    const voted = d.voted;

    const hint = voted
        ? 'Твой голос на сегодня учтён. Итоги подведём в полночь по Москве — победитель станет цитатой дня.'
        : 'Каждый день — новые 8 цитат. Один голос в день. В полночь по Москве победитель становится цитатой дня.';

    voteBody.innerHTML = '<p class="vote-hint">' + hint + '</p><div class="ach-list">' +
        cands.map(c => {
            const n = counts[c.id] || 0;
            const mine = voted === c.id;
            return '<div class="vote-item' + (mine ? ' mine' : '') + '">' +
                '<div class="vote-item-text">' +
                    '<span class="vote-item-quote">«' + esc(c.q.text) + '»</span>' +
                    '<span class="vote-item-meta">' + esc(placeOf(c.q)) + '</span>' +
                '</div>' +
                '<div class="vote-item-side">' +
                    '<span class="vote-item-count"><b>' + n + '</b> ' + plural(n, 'голос', 'голоса', 'голосов') + '</span>' +
                    '<button class="vote-pick" type="button" data-id="' + c.id + '"' + ((voted || voteBusy) ? ' disabled' : '') + '>' +
                        (mine ? '✓ Твой голос' : 'Голосовать') + '</button>' +
                '</div></div>';
        }).join('') + '</div>';
}

async function loadVotes() {
    try {
        const r = await fetch(VOTE_API + '?cid=' + encodeURIComponent(CLIENT_ID), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        voteData = await r.json();
        if (voteData.voted && !voteLog[voteData.day]) recordVote(voteData.day, voteData.voted, false);
        renderQotd();
        if (!voteModal.hidden) renderVoteList();
        resolveVoteResults();
    } catch (e) {
        // нет бэкенда (GitHub Pages, file://) — голосование скрыто
        voteData = null;
        qotdEl.hidden = true;
    }
}

voteBody.addEventListener('click', async (e) => {
    const btn = e.target.closest('.vote-pick');
    if (!btn || !voteData || voteData.voted || voteBusy) return;
    voteBusy = true;
    const wasFirst = (voteData.today || []).every(x => !x.votes);
    renderVoteList();
    try {
        const r = await fetch(VOTE_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: btn.dataset.id, cid: CLIENT_ID }),
        });
        if (r.ok) recordVote(voteData.day, btn.dataset.id, wasFirst);
        if (r.status === 429) alert('С этой сети уже проголосовало слишком много людей. Попробуй позже.');
        else if (!r.ok && r.status !== 409) alert('Не удалось отправить голос, попробуй позже.');
    } catch (err) {
        alert('Не удалось отправить голос, попробуй позже.');
    }
    voteBusy = false;
    await loadVotes();
    renderVoteList();
});

function openVote()  { renderVoteList(); voteModal.hidden = false; document.body.style.overflow = 'hidden'; loadVotes(); }
function closeVote() { voteModal.hidden = true; document.body.style.overflow = ''; }
voteOpen.addEventListener('click', openVote);
voteClose.addEventListener('click', closeVote);
voteModal.addEventListener('click', (e) => { if (e.target === voteModal) closeVote(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !voteModal.hidden) closeVote(); });

loadVotes();
setInterval(loadVotes, 5 * 60 * 1000);
</script>
