<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a09">
<title>Цитатник Илюхи Мазеллова</title>
<style>
:root {
    color-scheme: dark;
    --ink: #080a09;
    --paper: #f3f4ef;
    --muted: #858585;
    --mint: #ffffff;
    --acid: #ffffff;
}
* { box-sizing: border-box; }

body {
    min-height: 100svh;
    margin: 0;
    overflow-x: hidden;
    background: var(--ink);
    color: var(--paper);
    font-family: "Arial", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
}

body::before {
    position: fixed;
    z-index: 0;
    inset: 0;
    pointer-events: none;
    content: "";
    opacity: .18;
    background-image: radial-gradient(#ffffff 0.65px, transparent 0.65px);
    background-size: 7px 7px;
    mask-image: linear-gradient(115deg, transparent 8%, #000 60%, transparent 98%);
}

.page {
    position: relative;
    z-index: 1;
    display: flex;
    min-height: 100svh;
    flex-direction: column;
    width: min(100% - 48px, 1280px);
    margin: auto;
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 0;
    border-bottom: 1px solid #ffffff20;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 10px; height: 10px; background: var(--acid); }

/* ── Достижения ── */
.achievements-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #ffffff14;
    background: #0b0d0c;
}
.achievements-bar .ach-title {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-right: 4px;
}
.ach-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid #ffffff24;
    background: #111412;
    color: #6d736f;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: default;
    transition: border-color .2s ease, color .2s ease, background .2s ease;
}
.ach-badge.unlocked {
    border-color: #b98cff70;
    background: #1a1428;
    color: #d9c2ff;
}
.ach-badge .ach-icon {
    width: 10px;
    height: 10px;
    flex: 0 0 auto;
}
.ach-badge.unlocked .ach-icon { color: #b98cff; }
.ach-badge.locked .ach-icon { color: #ffffff30; }

/* ── Тост достижения ── */
.ach-toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 90;
    transform: translate(-50%, 20px);
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: min(92vw, 420px);
    padding: 12px 16px;
    border: 1px solid #b98cff70;
    background: #14101e;
    color: var(--paper);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease, transform .35s ease;
}
.ach-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}
.ach-toast .ach-toast-icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: #b98cff;
}
.ach-toast .ach-toast-text { min-width: 0; }
.ach-toast .ach-toast-label {
    display: block;
    color: #b98cff;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.ach-toast .ach-toast-name {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -.01em;
}
.ach-toast .ach-toast-desc {
    display: block;
    margin-top: 2px;
    color: #adb2ae;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .04em;
}

.catalog-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border: 1px solid #ffffff40;
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    transition: background .2s ease, color .2s ease;
}
.catalog-btn:hover { background: var(--paper); color: var(--ink); }

main {
    display: grid;
    flex: 1;
    align-content: center;
    justify-items: center;
    padding: 80px 0 100px;
    text-align: center;
}

button {
    display: inline-flex;
    min-height: 58px;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 38px;
    padding: 0 24px;
    border: 0;
    background: var(--acid);
    color: var(--ink);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .11em;
    text-transform: uppercase;
    transition: transform .2s ease, background .2s ease;
}
button:hover { transform: translateY(-3px); background: #d9d9d9; }
button:focus-visible { outline: 2px solid var(--paper); outline-offset: 5px; }
button .arrow { display: inline-flex; width: 16px; height: 16px; }
button .arrow svg { display: block; width: 100%; height: 100%; }

.quote-card {
    position: relative;
    width: min(100%, 760px);
    min-height: 180px;
    margin-top: 56px;
    padding: 34px 34px 30px;
    border: 1px solid #ffffff24;
    background: #111412e8;
    animation: card-in .9s ease both;
}
.quote-card::before {
    position: absolute;
    top: -36px;
    left: 50%;
    z-index: 1;
    width: 25px;
    height: 34px;
    clip-path: path("M 12.5 0 C 9 7, 1 18, 1 23 C 1 30, 6 34, 12.5 34 C 19 34, 24 30, 24 23 C 24 18, 16 7, 12.5 0 Z");
    background: var(--paper);
    content: "";
    opacity: 0;
    transform: translate(-50%, -20px) scale(.65,.8);
    pointer-events: none;
}
.quote-card::after {
    position: absolute;
    top: -3px;
    left: 50%;
    width: 150px;
    height: 48px;
    background: radial-gradient(circle at 13% 28%, #fff 0 2px, transparent 3px), radial-gradient(circle at 87% 25%, #fff 0 2px, transparent 3px), radial-gradient(circle at 28% 9%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 72% 7%, #fff 0 1.5px, transparent 2.5px), radial-gradient(ellipse at center, transparent 27%, #fff 29% 31%, transparent 33% 52%, #fff 54% 56%, transparent 58% 76%, #fff 78% 80%, transparent 82%);
    content: "";
    opacity: 0;
    transform: translate(-50%, -50%) scale(.15, .35);
    pointer-events: none;
}
.quote-card.dropping::before { animation: drop-in .72s cubic-bezier(.2,.7,.25,1) both; }
.quote-card.dropping::after  { animation: splash .55s .57s ease-out both; }
.quote-card.dropping .quote-text,
.quote-card.dropping .track,
.quote-card.dropping .album  { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }
.quote-card.dropping .listen-link { animation: reveal .55s 1s cubic-bezier(.2,.7,.2,1) both; }
.quote-card[hidden] { display: none; }

.quote-text {
    margin: 0 auto;
    font-size: clamp(22px, 4.2vw, 38px);
    font-weight: 800;
    letter-spacing: -.045em;
    line-height: 1.23;
}
.track {
    margin: 14px 0 0;
    color: var(--mint);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.track[hidden] { display: none; margin: 0; }

.album {
    margin: 6px 0 0;
    color: var(--mint);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
}
.album[hidden] { display: none; margin: 0; }

.secret-mark {
    margin: 10px 0 0;
    color: #b98cff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .2em;
    text-transform: uppercase;
}
.secret-mark[hidden] { display: none; }

.listen-link {
    display: inline-flex;
    min-height: 42px;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
    padding: 0 16px;
    border: 1px solid #ffffff70;
    color: var(--paper);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .13em;
    text-decoration: none;
    text-transform: uppercase;
    transition: background .2s ease, color .2s ease;
}
.listen-link:hover { background: var(--paper); color: var(--ink); }
.listen-link svg { width: 13px; height: 13px; }

.card-cover {
    display: block;
    width: 104px;
    height: 104px;
    margin: 26px auto 0;
    object-fit: cover;
    border: 1px solid #ffffff24;
    background: #1a1d1b;
}
.card-cover[hidden] { display: none; }
.quote-card.dropping .card-cover { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }
.quote-card.dropping .feats { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }

.feats {
    margin: 8px 0 0;
    color: #adb2ae;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
}
.feats[hidden] { display: none; margin: 0; }
.feats b { color: var(--paper); }
.badge {
    display: inline-block;
    margin-right: 6px;
    padding: 2px 6px;
    border: 1px solid #ffffff50;
    color: var(--paper);
    font-size: 9px;
    letter-spacing: .14em;
}

.counter {
    margin-top: 18px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.counter strong { color: var(--paper); }
.counter.limit  { color: #ff6b6b; }

.reset-timer {
    margin-top: 6px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.reset-timer strong {
    color: var(--paper);
    font-variant-numeric: tabular-nums;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #000000cc;
    backdrop-filter: blur(4px);
    animation: fade-in .2s ease both;
}
.modal[hidden] { display: none; }
.modal-box {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(100%, 860px);
    max-height: 88svh;
    border: 1px solid #ffffff30;
    background: #0e100f;
}

.cat-text-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.cat-note {
    display: inline-block;
    margin-top: 4px;
    color: #b98cff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    line-height: 1.4;
    text-transform: none;
    font-style: italic;
}

#quote-button:disabled {
    opacity: .4;
    cursor: not-allowed;
    transform: none;
}
#quote-button:disabled:hover {
    background: var(--acid);
    transform: none;
}

.modal-search {
    position: relative;
    padding: 8px 44px 8px 12px;
}
.modal-search input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ffffff30;
    background: #080a09;
    color: var(--paper);
    font: inherit;
    font-size: 13px;
    outline: none;
}
.modal-search input:focus { border-color: #ffffff70; }

.modal-close {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    z-index: 5;
    width: 30px;
    height: 30px;
    min-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #ffffff30;
    background: #0e100f;
    color: var(--paper);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    margin: 0;
    padding: 0;
}
.modal-close:hover { background: var(--paper); color: var(--ink); }

.modal-body {
    overflow-y: auto;
    padding: 4px 12px 14px;
}

.album-card {
    margin-bottom: 6px;
    border: 1px solid #ffffff14;
    background: #111412c0;
    transition: border-color .2s ease;
}
.album-card.open { border-color: #ffffff35; }

.album-card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    font: inherit;
    text-align: left;
    transition: background .2s ease;
    min-height: 0;
    margin: 0;
    text-transform: none;
    letter-spacing: normal;
    line-height: normal;
}
.album-card-head:hover { background: #ffffff0a; }
.album-card-head:focus-visible { outline: 2px solid var(--paper); outline-offset: -2px; }

.album-cover-wrap {
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border: 1px solid #ffffff1a;
    background: #1a1d1b;
    overflow: hidden;
}
.album-cover-wrap img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.album-cover-wrap.ph {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff40;
    font-size: 14px;
}

.album-info { flex: 1; min-width: 0; }
.album-title {
    margin: 0;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.album-stats {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
}
.album-stats b { color: var(--paper); }

.album-chevron {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: var(--muted);
    transition: transform .25s ease, color .2s ease;
}
.album-card.open .album-chevron {
    transform: rotate(180deg);
    color: var(--paper);
}

.album-tracks {
    overflow: hidden;
    max-height: 0;
    transition: max-height .35s ease;
}
.album-card.open .album-tracks {
    max-height: 4000px;
}

.track-group { padding: 8px 12px 4px; }
.track-group + .track-group { border-top: 1px solid #ffffff0d; }

.track-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 6px;
}
.track-cover {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    object-fit: cover;
    border: 1px solid #ffffff1a;
    background: #1a1d1b;
}
.track-cover.ph {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff40;
    font-size: 12px;
}
.track-head-info { min-width: 0; }
.track-title {
    margin: 0;
    color: var(--mint);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
}
.track-feats {
    margin: 2px 0 0;
    color: #adb2ae;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
}
.track-feats b { color: var(--paper); }
.track-feats .badge {
    display: inline-block;
    margin-right: 4px;
    padding: 1px 5px;
    border: 1px solid #ffffff50;
    color: var(--paper);
    font-size: 8px;
    letter-spacing: .12em;
}

.cat-item {
    display: flex;
    gap: 10px;
    padding: 6px 0;
    color: #c9ccc8;
    font-size: 13px;
    line-height: 1.5;
}
.cat-item .dot {
    flex: 0 0 auto;
    width: 6px;
    height: 6px;
    margin-top: 8px;
    background: #ffffff40;
}
.cat-item.seen .dot { background: #4caf50; }
.cat-item.seen { color: #6d736f; }

.cat-item.locked .cat-body {
    position: relative;
    user-select: none;
    flex: 1;
    min-width: 0;
}
.cat-item.locked .cat-text {
    filter: blur(4px);
    opacity: .55;
}
.cat-item.locked .cat-mask {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: linear-gradient(90deg, #0e100f 0%, #0e100fee 35%, #0e100fee 65%, #0e100f 100%);
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    pointer-events: none;
}
.cat-item.locked .cat-mask svg { width: 10px; height: 10px; }

@keyframes card-in {
    from { opacity: 0; transform: translateY(-8px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes drop-in {
    0%   { opacity: 0; transform: translate(-50%, -34px) scale(.65,.8); }
    12%  { opacity: 1; }
    70%  { opacity: 1; transform: translate(-50%, 44px) scale(.9,1.15); }
    82%  { opacity: 1; transform: translate(-50%, 35px) scale(1.1,.8); }
    100% { opacity: 0; transform: translate(-50%, 40px) scale(1.1,.8); }
}
@keyframes splash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(.15, .35); }
    14%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1, 1); }
}
@keyframes reveal {
    from { opacity: 0; transform: translateY(14px); filter: blur(5px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@media (max-width: 560px) {
    .page { width: min(100% - 32px, 1280px); }
    header { padding: 22px 0; font-size: 10px; }
    main   { padding: 66px 0 76px; }
    .quote-card { min-height: 0; padding: 28px 20px 25px; margin-top: 42px; }
    .modal { padding: 12px; }
    .modal-body { padding: 4px 10px 12px; }
    .track-group { padding: 8px 10px 4px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
<body>
<div class="page">
    <header>
        <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>mzlff</span>
        </div>
        <button class="catalog-btn" id="catalog-button" type="button">
            Каталог цитат
        </button>
    </header>
    <main>
        <button id="quote-button" type="button" aria-controls="quote-card">
            <span>Моя цитата</span>
            <span class="arrow" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none">
                    <path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
                </svg>
            </span>
        </button>
        <p class="counter" id="counter"></p>
        <p class="reset-timer" id="reset-timer"></p>
        <section class="quote-card" id="quote-card" aria-live="polite" aria-atomic="true" hidden>
            <p class="quote-text" id="quote-text"></p>
            <img class="card-cover" id="cover-img" alt="" hidden referrerpolicy="no-referrer">
            <p class="track" id="track-name"></p>
            <p class="feats" id="feats" hidden></p>
            <p class="album" id="album-name"></p>
            <p class="secret-mark" id="secret-mark" hidden></p>
            <a class="listen-link" id="listen-link" href="#" target="_blank" rel="noopener noreferrer">
                <span>Слушать</span>
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M4 12 12 4M5 4h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
                </svg>
            </a>
        </section>
    </main>
</div>

<div class="modal" id="catalog-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-label="Каталог цитат">
        <div class="modal-search">
            <input type="search" id="catalog-search" placeholder="Поиск по цитате, треку или альбому…" autocomplete="off">
            <button class="modal-close" id="catalog-close" type="button" aria-label="Закрыть">✕</button>
        </div>
        <div class="modal-body" id="catalog-body"></div>
    </div>
</div>

<script>

// ==========================================
// ДОСТИЖЕНИЯ
// ==========================================
const achievements = {
    svetlayastorona: { name: 'Ты на светлой стороне!',       desc: 'Закрыл все цитаты альбома «Светлая сторона»' },
    PHANTASMAGORIA:  { name: 'Добро пожаловать в парк!',     desc: 'Закрыл все цитаты альбома «PHANTASMAGORIA»' },
    ADHD:            { name: 'СДВГшник',                     desc: 'Закрыл все цитаты альбома «ADHD»' },
    HOLOD:           { name: 'Что-то тут какие-то холода ветра', desc: 'Закрыл все цитаты альбома «Холода ветра»' },
    MAYAK:           { name: 'Который нашёл маяк',           desc: 'Закрыл все цитаты альбома «К маяку вселенной»' },
    POTERYAN:        { name: 'Мир потеряли, но ты его нашёл', desc: 'Закрыл все цитаты альбома «Потерянный мир»' },
    COSMOC:          { name: 'Нашли формулу нового',          desc: 'Закрыл все цитаты альбома «Космоцветок»' },

		{ track: 'Небо красное полотно (live)', album: 'AKUST', text: 'Небо красное полотно. Красное полотно.' },
		{ track: 'Небо красное полотно (live)', album: 'AKUST', text: 'Сделать искусством то, что не берегут.' },

		{ track: 'Откат', album: 'AKUST', text: 'Вечно существовать — не жить. Хочу в откат.' },
		{ track: 'Откат', album: 'AKUST', text: 'Как оказалось в конце, богом был я. Но если это так, тогда откуда тот бессмертный дар?' },
		{ track: 'Откат', album: 'AKUST', text: 'И на этом вся жизнь поверь закончится когда-то. Я пойму, но поздно, что все не обман.' },
		{ track: 'Откат', album: 'AKUST', text: 'Мне время по колено, но не стоит думать, что это так здорово. Мальчик, это мешает.' },

		{ track: 'Цветочек маленький', album: 'AKUST', text: 'Любовь сильнее страха, сильнее всего в этом мире. И вот она пустилась в путь, навстречу Биллу.' },
		{ track: 'Цветочек маленький', album: 'AKUST', text: 'Оставив дом, мы с тобою идём вдвоём. Давай оставим всё лишь ради встречи вновь.' },
		{ track: 'Цветочек маленький', album: 'AKUST', text: 'Она ждала его долго — несколько дней. Скажите мало, но с такой любовью надо быстрей.' },
		{ track: 'Цветочек маленький', album: 'AKUST', text: 'А на столе стоял тот самый цветок. Её красивый, живой, цветочек маленький.' },

		{ track: 'абсолютный ноль', album: 'MAYAK', text: 'Время лечит, но во времени я — абсолютный ноль. В отрезке времени изгой.' },
		{ track: 'абсолютный ноль', album: 'MAYAK', text: 'Петля захлопнется со мной, и я потерян, в тесноте, да не в обиде, но живой.' },
		{ track: 'абсолютный ноль', album: 'MAYAK', text: 'Время замкнёт и нас обоих. В этом городе где человек, как абсолютный ноль.' },
		{ track: 'абсолютный ноль', album: 'MAYAK', text: 'Петля как бусики на шее. Крепкий узелок, и мы в крепких отношениях.' },

		{ track: 'аэростат', album: 'MAYAK', text: 'Правде вторить любить я стал, но коль у каждого своя, то, будь добр, душить отстань.' },
		{ track: 'аэростат', album: 'MAYAK', text: 'Где не понять, кто нет, кто прав. Накроет город томный туман. И никогда не сможет стать счастливым этот грустный роман.' },
		{ track: 'аэростат', album: 'MAYAK', text: 'Я сотворю тебе письмо. Хоть знаю, ты не понимаешь моих песен, но.' },
		{ track: 'аэростат', album: 'MAYAK', text: 'Для меня семь дней на неделе — это семь нот.' },

		{ track: 'беспорядочная сказка (Муза III)', album: 'MAYAK', text: 'Чем я лучше живу, тем та больше бодается. Зависть кусается, но не более.' },
		{ track: 'беспорядочная сказка (Муза III)', album: 'MAYAK', text: 'Вернусь опять писать наверно беспорядочную сказку о том, где все мы.' },
		{ track: 'беспорядочная сказка (Муза III)', album: 'MAYAK', text: 'И мой исписан стол, напившись снова. Спрячусь как все, в своих рассказах где-то.' },
		{ track: 'беспорядочная сказка (Муза III)', album: 'MAYAK', text: 'Я, ты, мы, каждый из нас — кислые аскорбинки.' },

		{ track: 'глобальный вайп', album: 'MAYAK', text: 'Ведь наша жизнь — игра, то есть донатная помойка, неправильно и горько.' },
		{ track: 'глобальный вайп', album: 'MAYAK', text: 'И когда вся информация в нас канет во времени, тогда же и поймём, всё.' },
		{ track: 'глобальный вайп', album: 'MAYAK', text: 'Меня всё это достало, я хочу обновления. Если нами играют плохо так.' },
		{ track: 'глобальный вайп', album: 'MAYAK', text: 'Моя дата регистрации — двадцать восьмое апреля. Год девяносто девятый, я тут далеко не первый.' },

		{ track: 'который ищет маяк', album: 'MAYAK', text: 'Я виноват, но в дальнем космосе, мне была мила тьма.' },
		{ track: 'который ищет маяк', album: 'MAYAK', text: 'Увидимся в следующем мире. Знак спасать я поздно выбрал.' },
		{ track: 'который ищет маяк', album: 'MAYAK', text: 'Квазар, оставь, нас там, где были. И стань, звезда, нам как, погибель.' },
		{ track: 'который ищет маяк', album: 'MAYAK', text: 'Ким, и я смог найти Космоцветок. Отыскал, забирай, не горюй, всё не как на картинках.' },

		{ track: 'кто-то должен опылять цветок', album: 'MAYAK', text: 'Хотели бы летать, беззаботно и высоко, но даже знает насекомое, что кто-то должен опылять цветок.' },
		{ track: 'кто-то должен опылять цветок', album: 'MAYAK', text: 'Мир, построенный на костях, никогда не взрастёт цветами.' },
		{ track: 'кто-то должен опылять цветок', album: 'MAYAK', text: 'Жизнь делится секторами, как гексы глазами пчёл.' },
		{ track: 'кто-то должен опылять цветок', album: 'MAYAK', text: 'Когда нет ничего, но что лучше, чем благодать. Мир, построенный на костях, никогда не взрастёт цветами.' },

		{ track: 'не то, что ты хотела бы слышать под лоуфай', album: 'MAYAK', text: 'Ты так долго носила маску, что забыл черты лица.' },
		{ track: 'не то, что ты хотела бы слышать под лоуфай', album: 'MAYAK', text: 'Пишу не то, что ты хотела бы слышать под лоуфай.' },
		{ track: 'не то, что ты хотела бы слышать под лоуфай', album: 'MAYAK', text: 'Время летит рассветами, закатами. Что лечишь я не знал, но теперь и мне всё понятно.' },
		{ track: 'не то, что ты хотела бы слышать под лоуфай', album: 'MAYAK', text: 'Хочешь меня забыть, но такое не забывается.' },

		{ track: 'оттепели не быть', album: 'MAYAK', text: 'Личность пошлют, и она пойдёт. Куда дорога приведёт, вдруг?' },
		{ track: 'оттепели не быть', album: 'MAYAK', text: 'Жарил, как в топка в поезде, оттепели не быть.' },
		{ track: 'оттепели не быть', album: 'MAYAK', text: 'Мне уже не наверстать, и попрятались мои доводы. Я громко восклицаю: «Да пропади оно пропадом!»' },
		{ track: 'оттепели не быть', album: 'MAYAK', text: 'Ты боязно догонишь, что поздно друг уходить. Хоть тебе сотню раз, твой собственный мозг умолял остыть.' },

		{ track: 'позже будет больнее', album: 'MAYAK', text: 'В девочке нет горя и жалости, но поверь, она пока не понимает, но позже будет больней.' },
		{ track: 'позже будет больнее', album: 'MAYAK', text: 'И взрослыми был соткан мир — тот тонный мир, тот тёмный мир. Странный мир, страшный мир, каждый миг.' },
		{ track: 'позже будет больнее', album: 'MAYAK', text: 'Где жизнь — это счастье, как будто на самом деле. И Солнце не гаснет, где добрый мир нас пригреет.' },
		{ track: 'позже будет больнее', album: 'MAYAK', text: 'Нам жаль, но есть вещи, что исправить нет времени.' },

		{ track: 'рожденный умереть', album: 'MAYAK', text: 'Убийство — это плохо, но, что плохо — то я.' },
		{ track: 'рожденный умереть', album: 'MAYAK', text: 'Я рождённый умереть не один, а бесконечное количество раз.' },
		{ track: 'рожденный умереть', album: 'MAYAK', text: 'Природе непонятно, зато я похоже что-то начал понимать.' },
		{ track: 'рожденный умереть', album: 'MAYAK', text: 'Один хороший я, паразит — не грусти, избавлю вас от себя.' },

		{ track: 'тебе понравится', album: 'MAYAK', text: 'А жить здорово, правильно? Здорово осознавать — ты живой! Остальное — не главное.' },
		{ track: 'тебе понравится', album: 'MAYAK', text: 'Я пустой абсолютно. В траур никто не пускает салюты. Даже не страшно от последствий.' },
		{ track: 'тебе понравится', album: 'MAYAK', text: 'Тебе понравится. Я заебался, устал и не справился. Это ль не празднество?' },
		{ track: 'тебе понравится', album: 'MAYAK', text: 'Вижу мир в двух цветах: «люблю» и «пошёл нахуй».' },

		{ track: 'ты рядом', album: 'MAYAK', text: 'Мысли мне напоминают о том, чего не учёл. Летописи навека, но задумчивы, не о чём.' },
		{ track: 'ты рядом', album: 'MAYAK', text: 'Ты рядом, ты рядом, но я не могу. Терять их, терять их, снова одному.' },
		{ track: 'ты рядом', album: 'MAYAK', text: 'Мне в вакууме дышится проще, чем в пространстве, закрытом коммунальным чеком.' },
		{ track: 'ты рядом', album: 'MAYAK', text: 'В любви сливаются даже галактики.' },

		{ track: 'тэм на коллеж', album: 'MAYAK', text: 'В доброте зла не прописано, в зле доброта найдется. Всё, это просто немыслимо, мыслить это не просто.' },
		{ track: 'тэм на коллеж', album: 'MAYAK', text: 'Меня честно волнует хватит ли денег, для тэм на коллеж.' },
		{ track: 'тэм на коллеж', album: 'MAYAK', text: 'Сюжет всегда повернется, спиной, ладно ну что ж. Меня честно волнует хватит ли денег, для тэм на коллеж.' },
		{ track: 'тэм на коллеж', album: 'MAYAK', text: 'И в панике забит игрок, что игра забагана, дико лагает. Управление как будто не то, но с чего он взял что управляет?' },

		{ track: 'человейники', album: 'MAYAK', text: 'С этой временной петли нам шею вызволить вообще никак. Дом-работа-гроб, такой вот ритм человейника.' },
		{ track: 'человейники', album: 'MAYAK', text: 'Но в человейнике, каждый оставит след.' },
		{ track: 'человейники', album: 'MAYAK', text: 'Над городом туман, и счастья нет. Болото из оков сжимает, и в окнах погаснет свет.' },
		{ track: 'человейники', album: 'MAYAK', text: 'Раз мне нет мнения милее, чем своё. Я шлю всё это к чёрту, и город горит огнём.' },

		{ track: 'Девочка из аптечной', album: 'COSMOC', text: 'Я лечу душу, ты — сердце. Больна планета по-разному, и нам некуда деться.' },
		{ track: 'Девочка из аптечной', album: 'COSMOC', text: 'Но нас одно объединяет — отвратительный почерк.' },
		{ track: 'Девочка из аптечной', album: 'COSMOC', text: 'Дождик закончится, плюс — это лишь случайная встреча. И я в аптеке, где мне не помогут, ведь любовь не лечится.' },
		{ track: 'Девочка из аптечной', album: 'COSMOC', text: 'Девочка-доктор смотрела им вслед. Это могло значить лишь одно.' },

		{ track: 'Диана', album: 'COSMOC', text: 'Мне непросто уйти. Я смотрю вслед, ты так и знай.' },
		{ track: 'Диана', album: 'COSMOC', text: 'Выкрути музыку громче, и мы станем потише.' },
		{ track: 'Диана', album: 'COSMOC', text: 'Я вас рад так видеть, в этом алко-трипе. Вы принцесса желанная.' },
		{ track: 'Диана', album: 'COSMOC', text: 'Ведь жизнь — это гонка, а мы ведь на скорости. Несёмся, не бойся, я рядом, слышишь.' },

		{ track: 'Космоцветок', album: 'COSMOC', text: 'Мы скитаемся в поисках формулы нового, но больше нового нет.' },
		{ track: 'Космоцветок', album: 'COSMOC', text: 'Я продолжаю путь ввысь, забрать космоцветок, чтобы дети увидели солнце.' },
		{ track: 'Космоцветок', album: 'COSMOC', text: 'После сытости голод, но после дождика солнце и свет.' },
		{ track: 'Космоцветок', album: 'COSMOC', text: 'Абстракция — самая верная формула.' },

		{ track: 'Люцифер стихотворное', album: 'COSMOC', text: 'Кто продал душу и думает, что уже богат, не представляя, что такое настоящий Ад.' },
		{ track: 'Люцифер стихотворное', album: 'COSMOC', text: 'Ну, здравствуйте, животные! Знакомьтесь, Люцифер.' },
		{ track: 'Люцифер стихотворное', album: 'COSMOC', text: 'Я мастер небылицы, веселитесь. Всем желаниям недозволенным тут от меня не скрыться.' },
		{ track: 'Люцифер стихотворное', album: 'COSMOC', text: 'Забыв про нравственность, я преодолел барьер.' },

		{ track: 'Новая муза', album: 'COSMOC', text: 'Мой след беглый, я — тень прошлого себя. Мой свет блеклый, я здесь, чтобы забрать тебя.' },
		{ track: 'Новая муза', album: 'COSMOC', text: 'И нет таких, кем бы не руководили. Но если тебя вёл не я, то тебя наебали сильно.' },
		{ track: 'Новая муза', album: 'COSMOC', text: 'Пока тебя ведь не было рядом, всё замело, и моя родная муза, теперь я не знаю кто я.' },
		{ track: 'Новая муза', album: 'COSMOC', text: 'Я твоя ненависть, мерзость, но я скучал так же, как ты.' },

		{ track: 'Противоречие выборов', album: 'COSMOC', text: 'Врать — это плохо, во благо — не ложь. Бабки — порок, но без них мы не можем.' },
		{ track: 'Противоречие выборов', album: 'COSMOC', text: 'Палитра возможностей с противоречием выборов. Ведь не важно почему, важно, что все же убили.' },
		{ track: 'Противоречие выборов', album: 'COSMOC', text: 'Волки, волки — не видно никого. Волки, волки — снова угроз не видно.' },
		{ track: 'Противоречие выборов', album: 'COSMOC', text: 'У меня мальчик просто хотел уйти с волками. Тварям ведь корысть — как двигатель, волк про неё не знает.' },

		{ track: 'Сказка о теневом мире', album: 'COSMOC', text: 'Мир — детская сказка, где тень каждой новой страницы сотрет, не простившись с деталями старыми.' },
		{ track: 'Сказка о теневом мире', album: 'COSMOC', text: 'Это значит — ещё живой. Человечешка у костра.' },
		{ track: 'Сказка о теневом мире', album: 'COSMOC', text: 'Колыбельной, и в хоровод. Силуэты сплетаются.' },
		{ track: 'Сказка о теневом мире', album: 'COSMOC', text: 'Мир — детская сказка, где тень каждой новой страницы сотрет, не простившись с деталями старыми.' },

		{ track: 'Шестьдесят минут', album: 'COSMOC', text: 'Мы не причастны к времени и, пресмыкаясь, все идём, время бежит, но мы с ним не пересекаемся.' },
		{ track: 'Шестьдесят минут', album: 'COSMOC', text: 'Твой час — это затравка перед тем как ты уйдёшь. Мой час уже настал, ты, как и я, этого ждёшь.' },
		{ track: 'Шестьдесят минут', album: 'COSMOC', text: 'Шестьдесят минут за час. Шестьдесят мотивов быть минуточку несчастливым.' },
		{ track: 'Шестьдесят минут', album: 'COSMOC', text: 'Вот так стекает в часики оставшийся песок. Солнца нет, пуст восход, лучик больше не придёт.' },

		{ track: 'Эвкалиптовая ветвь', album: 'COSMOC', text: 'Мой дом не где город поселки, ведь мой дом нигде, на мира карте крест стёрт.' },
		{ track: 'Эвкалиптовая ветвь', album: 'COSMOC', text: 'Кто зрелый снаружи, внутри будет вечнозелёным.' },
		{ track: 'Эвкалиптовая ветвь', album: 'COSMOC', text: 'Эвкалиптова ветвь. Как последний оплот, мы изгнанники с острова вдали от нации.' },
		{ track: 'Эвкалиптовая ветвь', album: 'COSMOC', text: 'Мне нужен не дом, а чтоб выбраться средство, я выберу искренность, честность.' },

		{ track: 'Город за горизонтом', album: 'nichego', text: 'Достигну цель и вернусь, мне поверь. Что же может случится в пути, там были до нас.' },
		{ track: 'Город за горизонтом', album: 'nichego', text: 'Уверенность — смена тревоги. Душа нашептала о доме забыть.' },
		{ track: 'Город за горизонтом', album: 'nichego', text: 'Сочится свет через тучи огней. Салюты яркими красками накрывают наш праздник.' },
		{ track: 'Город за горизонтом', album: 'nichego', text: 'Смотритель стоит и смеётся мне вслед.' },

		{ track: 'История о семействе мушек с хорошей концовкой', album: 'nichego', text: 'Баю-бай, спи спокойно милый друг. Твоя прогнившая плоть — это домик для маленьких мух.' },
		{ track: 'История о семействе мушек с хорошей концовкой', album: 'nichego', text: 'Кусками плоть гниёт, семейство мушек в вагоне с едой. Они просто хотят кушать, а кушать — это святое.' },
		{ track: 'История о семействе мушек с хорошей концовкой', album: 'nichego', text: 'Крепкая семья: папочка, мамочка, дети и бабушка. Весело летать, у забродившей воды, в промежутке рельс.' },
		{ track: 'История о семействе мушек с хорошей концовкой', album: 'nichego', text: 'Твоя прогнившая плоть — это домик для маленьких мух.' },

		{ track: 'Муза', album: 'nichego', text: 'Через багровый лес метафор, как человек в скафандре, я покоряю космос из мыслей, где звёзды спали бы.' },
		{ track: 'Муза', album: 'nichego', text: 'Я тебя сброшу вниз с обрыва грёз моих. Ещё век будешь падать, мир слышит, капают слёзы.' },
		{ track: 'Муза', album: 'nichego', text: 'Снова скитаешься в мире, горы песка. Я утопил своё горе, тебя заставив оазис искать.' },
		{ track: 'Муза', album: 'nichego', text: 'И ты станцуешь изящно в багровом платье на выпускном.' },

		{ track: 'Отражение', album: 'nichego', text: 'Выжженная земля как память для нас. И пламя огня вместо тысячи фраз.' },

const LS_COVERS = 'mzlff:covers';
const ARTIST_RE = /mzlff/i;
let coverCache = {};
try { coverCache = JSON.parse(localStorage.getItem(LS_COVERS) || '{}') || {}; } catch (e) {}
function saveCoverCache() { try { localStorage.setItem(LS_COVERS, JSON.stringify(coverCache)); } catch (e) {} }

function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function parseTrack(raw) {
    const m = raw.match(/\s*[\(\[]\s*(?:feat\.?|ft\.?|при уч\.?|совм\.? с)\s+([^)\]]+)[\)\]]\s*$/i);
    if (!m) return { title: raw, feats: [] };
    const feats = m[1].split(/\s*(?:,|&|×|\s+x\s+|\s+и\s+|\s+and\s+)\s*/i).map(x => x.trim()).filter(Boolean);
    return { title: raw.slice(0, m.index).trim(), feats };
}
function shortName(n) {
    const s = String(n || '').trim();
    return s.replace(/\s*[\(\[][^)\]]*[\)\]]\s*$/, '').trim() || s;
}
function trackMeta(quote) {
    const parsed = parseTrack(quote.track);
    const info = TRACK_INFO[quote.album + '|' + quote.track] || {};
    const isFit = quote.album.startsWith('fit_');
    const feats = [...new Set((info.feats && info.feats.length ? info.feats : parsed.feats).map(shortName))].filter(n => n && !ARTIST_RE.test(n));
    return { title: parsed.title, feats, main: shortName(info.main || ''), isFit };
}
function featsHtml(quote) {
    const m = trackMeta(quote);
    const parts = [];
    if (m.isFit) {
        parts.push('<span class="badge">ФИТ</span>' + (m.main ? 'трек <b>' + esc(m.main) + '</b>' : 'mzlff в гостях'));
        if (m.feats.length) parts.push('с ' + m.feats.map(n => '<b>' + esc(n) + '</b>').join(', '));
    } else if (m.feats.length) {
        parts.push('<span class="badge">FEAT</span>' + m.feats.map(n => '<b>' + esc(n) + '</b>').join(', '));
    }
    return parts.join(' · ');
}
function albumLabel(quote) {
    const a = albums[quote.album];
    if (a && a.title) return a.title;
    if (quote.album && (quote.album.startsWith('singl_') || quote.album.startsWith('fit_'))) {
        const t = quote.track ? parseTrack(quote.track).title : '';
        return t || (quote.album.startsWith('fit_') ? 'Фит' : 'Сингл');
    }
    return quote.album || '';
}

function jsonp(url, timeout = 6000) {
    return new Promise((resolve, reject) => {
        const cb = '__jp' + Math.random().toString(36).slice(2);
        const el = document.createElement('script');
        const done = (fn, v) => { delete window[cb]; el.remove(); clearTimeout(t); fn(v); };
        const t = setTimeout(() => done(reject, new Error('timeout')), timeout);
        window[cb] = data => done(resolve, data);
        el.onerror = () => done(reject, new Error('error'));
        el.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
        document.head.appendChild(el);
    });
}
async function liveItunes(term) {
    const r = await fetch('https://itunes.apple.com/search?entity=song&limit=8&term=' + encodeURIComponent('mzlff ' + term));
    const j = await r.json();
    const hit = (j.results || []).find(x => ARTIST_RE.test(x.artistName || '') && x.artworkUrl100);
    return hit ? hit.artworkUrl100.replace(/\d+x\d+bb/, '600x600bb') : '';
}
async function liveDeezer(term) {
    const j = await jsonp('https://api.deezer.com/search?q=' + encodeURIComponent('artist:"mzlff" ' + term));
    const hit = (j.data || []).find(x => x.album && x.album.cover_big);
    return hit ? hit.album.cover_big : '';
}
let liveQueue = Promise.resolve();
const inflight = {};
const LOCAL_DIR = 'covers/';
const LOCAL_EXTS = ['png', 'jpg', 'jpeg', 'webp'];
const localCache = {};
function probeImg(url) {
    return new Promise(resolve => {
        const im = new Image();
        im.onload = () => resolve(true);
        im.onerror = () => resolve(false);
        im.src = url;
    });
}
function localCover(key) {
    if (key in localCache) return localCache[key];
    const cands = [];
    const known = COVERS[key];
    if (known && !/^(https?:)?\/\//i.test(known)) cands.push(known);
    for (const ext of LOCAL_EXTS) {
        const p = LOCAL_DIR + key + '.' + ext;
        if (!cands.includes(p)) cands.push(p);
    }
    return localCache[key] = (async () => {
        for (const c of cands) if (await probeImg(c)) return c;
        return '';
    })();
}
function resolveCover(quote) {
    const key = quote.album;
    const a = albums[key] || {};
    if (a.cover) return Promise.resolve(a.cover);
    return localCover(key).then(local => local || resolveRemoteCover(quote));
}
function resolveRemoteCover(quote) {
    const key = quote.album;
    const a = albums[key] || {};
    const known = (/^(https?:)?\/\//i.test(COVERS[key] || '') ? COVERS[key] : '') || coverCache[key];
    if (known) return Promise.resolve(known);
    if (coverCache[key] === '') return Promise.resolve('');
    if (inflight[key]) return inflight[key];
    const term = (a.title || parseTrack(quote.track).title).replace(/\s*\(.*?\)\s*/g, ' ').trim();
    inflight[key] = liveQueue = liveQueue.then(async () => {
        let url = '';
        for (const fn of [liveItunes, liveDeezer]) {
            try { url = await fn(term); } catch (e) {}
            if (url) break;
        }
        coverCache[key] = url;
        saveCoverCache();
        await new Promise(r => setTimeout(r, 350));
        return url;
    });
    return inflight[key];
}
function setImg(img, url) {
    if (!url) { img.hidden = true; return; }
    img.onerror = () => { img.hidden = true; };
    img.onload = () => { img.hidden = false; };
    img.src = url;
}

// ==========================================
// ЛИМИТЫ / SEEN
// ==========================================
const DAILY_LIMIT = 20;
const LS_LIMIT = 'mzlff:limit';
const LS_SEEN  = 'mzlff:seen';

function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function loadLimitState() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_LIMIT) || 'null');
        if (raw && raw.date === todayKey()) return raw;
    } catch (e) {}
    return { date: todayKey(), count: 0 };
}
function saveLimitState(s) { try { localStorage.setItem(LS_LIMIT, JSON.stringify(s)); } catch (e) {} }
function loadSeen() {
    try {
        const raw = JSON.parse(localStorage.getItem(LS_SEEN) || 'null');
        if (raw && raw.date === todayKey() && Array.isArray(raw.indices)) return raw;
    } catch (e) {}
    return { date: todayKey(), indices: [] };
}
function saveSeen(s) { try { localStorage.setItem(LS_SEEN, JSON.stringify(s)); } catch (e) {} }

let limitState = loadLimitState();
let seenState  = loadSeen();

// ==========================================
// ПРОВЕРКА ДОСТИЖЕНИЙ
// ==========================================
function getAlbumQuoteIndices(albumKey) {
    const indices = [];
    quotes.forEach((q, i) => { if (q.album === albumKey) indices.push(i); });
    secretQuotes.forEach((q, i) => { if (q.album === albumKey) indices.push(quotes.length + i); });
    return indices;
}

function checkAchievements() {
    const seenSet = new Set(seenState.indices);
    let anyNew = false;

    for (const [albumKey, ach] of Object.entries(achievements)) {
        if (unlockedAchievements[albumKey]) continue;

        const indices = getAlbumQuoteIndices(albumKey);
        if (indices.length === 0) continue;

        const allSeen = indices.every(i => seenSet.has(i));
        if (!allSeen) continue;

        unlockedAchievements[albumKey] = true;
        anyNew = true;
        showAchievementToast(ach);
    }

    if (anyNew) saveAchievements(unlockedAchievements);
}

let toastTimer = null;
function showAchievementToast(ach) {
    let toast = document.querySelector('.ach-toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.className = 'ach-toast';
        toast.innerHTML = `
            <svg class="ach-toast-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 2l2.6 6.2 6.7.5-5.1 4.4 1.6 6.5L12 16.9 6.2 19.6l1.6-6.5-5.1-4.4 6.7-.5L12 2z"
                      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <span class="ach-toast-text">
                <span class="ach-toast-label">Достижение открыто</span>
                <span class="ach-toast-name"></span>
                <span class="ach-toast-desc"></span>
            </span>`;
        document.body.appendChild(toast);
    }
    toast.querySelector('.ach-toast-name').textContent = ach.name;
    toast.querySelector('.ach-toast-desc').textContent = ach.desc;

    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 4200);
}

// ==========================================
// DOM
// ==========================================
const button       = document.querySelector('#quote-button');
const card         = document.querySelector('#quote-card');
const quoteText    = document.querySelector('#quote-text');
const trackName    = document.querySelector('#track-name');
const albumName    = document.querySelector('#album-name');
const listenLink   = document.querySelector('#listen-link');
const counterEl    = document.querySelector('#counter');
const resetTimerEl = document.querySelector('#reset-timer');
const coverImg     = document.querySelector('#cover-img');
const featsEl      = document.querySelector('#feats');
const secretMark   = document.querySelector('#secret-mark');
const catalogBtn   = document.querySelector('#catalog-button');
const catalogModal = document.querySelector('#catalog-modal');
const catalogClose = document.querySelector('#catalog-close');
const catalogBody  = document.querySelector('#catalog-body');
const catalogSearch= document.querySelector('#catalog-search');

// ==========================================
// СЧЁТЧИК
// ==========================================
function updateCounter() {
    const remainingDaily = Math.max(0, DAILY_LIMIT - limitState.count);
    const totalQuotes    = quotes.length + secretQuotes.length;
    const remainingAll   = Math.max(0, totalQuotes - seenState.indices.length);

    counterEl.innerHTML = `Сегодня осталось: <strong>${remainingDaily}</strong> из ${DAILY_LIMIT}`;
    counterEl.classList.toggle('limit', remainingDaily === 0 || remainingAll === 0);

    const disabled = remainingDaily === 0 || remainingAll === 0;
    button.disabled = disabled;
    button.style.opacity = disabled ? .4 : 1;
    button.style.cursor  = disabled ? 'not-allowed' : 'pointer';
}

// ==========================================
// ТАЙМЕР ДО ОБНОВЛЕНИЯ (до полуночи)
// ==========================================
function msUntilReset() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
    return next - now;
}

function updateResetTimer() {
    const ms = msUntilReset();
    const totalSec = Math.max(0, Math.floor(ms / 1000));

    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;

    const pad = n => String(n).padStart(2, '0');

    if (totalSec <= 0) {
        resetTimerEl.innerHTML = 'Обновление…';
    } else {
        resetTimerEl.innerHTML =
            `Обновление через <strong>${pad(h)}:${pad(m)}:${pad(s)}</strong>`;
    }
}

setInterval(updateResetTimer, 1000);
updateResetTimer();

// ==========================================
// ВЫБОР ЦИТАТЫ (обычные + тайные)
// ==========================================
const SECRET_CHANCE = 0.10; // 10% шанс, что попадётся тайная

function getQuote(globalIndex) {
    if (globalIndex < quotes.length) return quotes[globalIndex];
    return secretQuotes[globalIndex - quotes.length];
}

function pickQuoteIndex() {
    const secretOffset = quotes.length;

    const usedRegular = new Set(seenState.indices.filter(i => i < secretOffset));
    const availableRegular = [];
    for (let i = 0; i < quotes.length; i++) {
        if (!usedRegular.has(i)) availableRegular.push(i);
    }

    const usedSecret = new Set(seenState.indices.filter(i => i >= secretOffset));
    const availableSecret = [];
    for (let i = 0; i < secretQuotes.length; i++) {
        const g = secretOffset + i;
        if (!usedSecret.has(g)) availableSecret.push(g);
    }

    if (availableRegular.length === 0 && availableSecret.length === 0) return -1;

    if (availableSecret.length > 0 && Math.random() < SECRET_CHANCE) {
        return availableSecret[Math.floor(Math.random() * availableSecret.length)];
    }

    if (availableRegular.length > 0) {
        return availableRegular[Math.floor(Math.random() * availableRegular.length)];
    }

    return availableSecret[Math.floor(Math.random() * availableSecret.length)];
}

// ==========================================
// ПОКАЗ ЦИТАТЫ
// ==========================================
button.addEventListener('click', () => {
    // Лимит исчерпан
    if (limitState.count >= DAILY_LIMIT) {
        quoteText.textContent = 'Лимит на сегодня исчерпан. Возвращайся после обновления.';
        trackName.hidden = true;
        albumName.hidden = true;
        featsEl.hidden = true;
        secretMark.hidden = true;
        coverImg.hidden = true;
        listenLink.href = '#';
        listenLink.style.display = 'none';
        card.hidden = false;
        card.classList.remove('dropping');
        void card.offsetWidth;
        card.classList.add('dropping');
        return;
    }

    const index = pickQuoteIndex();

    // Все цитаты закончились
    if (index < 0) {
        quoteText.textContent = 'Все цитаты открыты. Возвращайся позже.';
        trackName.hidden = true;
        albumName.hidden = true;
        featsEl.hidden = true;
        secretMark.hidden = true;
        coverImg.hidden = true;
        listenLink.href = '#';
        listenLink.style.display = 'none';
        card.hidden = false;
        card.classList.remove('dropping');
        void card.offsetWidth;
        card.classList.add('dropping');
        return;
    }

    listenLink.style.display = '';

    seenState.indices.push(index);
    saveSeen(seenState);
    limitState.count += 1;
    saveLimitState(limitState);
    updateCounter();
    checkAchievements();

    const quote = getQuote(index);
    const isSecret = index >= quotes.length;
    quoteText.textContent = '«' + quote.text + '»';

    const meta = trackMeta(quote);
    const albumText = albumLabel(quote);
    const sameName = meta.title === albumText && meta.title !== 'Космоцветок';

    if (sameName) {
        trackName.textContent = '';
        trackName.hidden = true;
        albumName.textContent = albumText;
        albumName.hidden = false;
    } else {
        trackName.textContent = meta.title;
        trackName.hidden = false;
        albumName.textContent = albumText;
        albumName.hidden = false;
    }

    const albumData = albums[quote.album];
    listenLink.href = albumData ? albumData.url : '#';

    const fh = featsHtml(quote);
    featsEl.innerHTML = fh;
    featsEl.hidden = !fh;

    secretMark.hidden = !isSecret;

    coverImg.hidden = true;
    resolveCover(quote).then(url => {
        if (trackName.textContent === meta.title || sameName) setImg(coverImg, url);
    });

    card.hidden = false;
    card.classList.remove('dropping');
    void card.offsetWidth;
    card.classList.add('dropping');
});

// ==========================================
// КАТАЛОГ — аккордеон по альбомам
// ==========================================
let openAlbumKey = null;

function buildCatalog() {
    const map = new Map();

    quotes.forEach((quote, i) => {
        if (!map.has(quote.album)) map.set(quote.album, new Map());
        const tracks = map.get(quote.album);
        if (!tracks.has(quote.track)) tracks.set(quote.track, []);
        tracks.get(quote.track).push(i);
    });

    secretQuotes.forEach((quote, i) => {
        const globalIdx = quotes.length + i;
        if (!map.has(quote.album)) map.set(quote.album, new Map());
        const tracks = map.get(quote.album);
        if (!tracks.has(quote.track)) tracks.set(quote.track, []);
        tracks.get(quote.track).push(globalIdx);
    });

    return map;
}
function orderedAlbumKeys(catalog) {
    const known = Object.keys(albums).filter(k => catalog.has(k));
    const rest  = [...catalog.keys()].filter(k => !known.includes(k));
    return [...known, ...rest];
}
function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
}

function renderAchievementsBar() {
    const existing = document.querySelector('.achievements-bar');
    if (existing) existing.remove();

    const total = Object.keys(achievements).length;
    const unlocked = Object.keys(achievements).filter(k => unlockedAchievements[k]).length;

    const bar = document.createElement('div');
    bar.className = 'achievements-bar';

    let html = `<span class="ach-title">Достижения ${unlocked}/${total}</span>`;

    for (const [key, ach] of Object.entries(achievements)) {
        const isUnlocked = !!unlockedAchievements[key];
        const cls = isUnlocked ? 'unlocked' : 'locked';
        const icon = isUnlocked
            ? `<svg class="ach-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                   <path d="M12 2l2.6 6.2 6.7.5-5.1 4.4 1.6 6.5L12 16.9 6.2 19.6l1.6-6.5-5.1-4.4 6.7-.5L12 2z"
                         stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
               </svg>`
            : `<svg class="ach-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                   <path d="M4 7V5a4 4 0 118 0v2M3 7h10v7H3z"
                         stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
               </svg>`;
        html += `<span class="ach-badge ${cls}" title="${esc(ach.desc)}">${icon}${esc(ach.name)}</span>`;
    }

    bar.innerHTML = html;

    const modalBox = document.querySelector('.modal-box');
    const body = document.querySelector('#catalog-body');
    modalBox.insertBefore(bar, body);
}

function renderCatalog(filter = '') {
    const catalog = buildCatalog();
    const q = filter.trim().toLowerCase();
    let html = '';
    let shownAlbums = 0;

    for (const albumKey of orderedAlbumKeys(catalog)) {
        const tracks = catalog.get(albumKey);
        const firstTrack = [...tracks.keys()][0];
        const title = albumLabel({ album: albumKey, track: firstTrack });

        let totalQuotes = 0, seenCount = 0;
        const matchedTracks = new Map();

        for (const [track, indices] of tracks) {
            const meta = trackMeta({ album: albumKey, track });
            const hay = (meta.title + ' ' + meta.feats.join(' ') + ' ' + meta.main).toLowerCase();
            const albumHay = title.toLowerCase();
            const trackMatches = !q || hay.includes(q) || albumHay.includes(q);
            const matchedIndices = indices.filter(i => !q || trackMatches || getQuote(i).text.toLowerCase().includes(q));
            if (matchedIndices.length === 0) continue;
            matchedTracks.set(track, matchedIndices);
            totalQuotes += matchedIndices.length;
            seenCount += matchedIndices.filter(i => seenState.indices.includes(i)).length;
        }
        if (matchedTracks.size === 0) continue;
        shownAlbums++;
        const isOpen = openAlbumKey === albumKey;
        const coverHtml = `<div class="album-cover-wrap ph" data-cover-album="${esc(albumKey)}">♪</div>`;

        html += `<div class="album-card${isOpen ? ' open' : ''}" data-album="${esc(albumKey)}">
            <button class="album-card-head" type="button" aria-expanded="${isOpen}">
                ${coverHtml}
                <div class="album-info">
                    <p class="album-title">${esc(title)}</p>
                    <p class="album-stats">${matchedTracks.size} ${plural(matchedTracks.size,'трек','трека','треков')} · <b>${seenCount}</b>/${totalQuotes} ${plural(totalQuotes,'цитата','цитаты','цитат')} открыто</p>
                </div>
                <svg class="album-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/>
                </svg>
            </button>
            <div class="album-tracks">
                ${[...matchedTracks].map(([track, indices]) => renderTrackGroup(albumKey, track, indices)).join('')}
            </div>
        </div>`;
    }
    if (shownAlbums === 0) {
        catalogBody.innerHTML = '<p style="color:#858585;padding:24px 0;text-align:center">Ничего не найдено.</p>';
        return;
    }
    catalogBody.innerHTML = html;

    catalogBody.querySelectorAll('.album-card-head').forEach(btn => {
        btn.addEventListener('click', () => {
            const cardEl = btn.closest('.album-card');
            const key = cardEl.dataset.album;
            const willOpen = !cardEl.classList.contains('open');
            catalogBody.querySelectorAll('.album-card').forEach(c => {
                c.classList.remove('open');
                c.querySelector('.album-card-head').setAttribute('aria-expanded', 'false');
            });
            if (willOpen) {
                cardEl.classList.add('open');
                btn.setAttribute('aria-expanded', 'true');
                openAlbumKey = key;
            } else {
                openAlbumKey = null;
            }
        });
    });
    hydrateCatalogCovers();
}

function renderTrackGroup(albumKey, track, indices) {
    const meta = trackMeta({ album: albumKey, track });
    const fh = featsHtml({ album: albumKey, track });
    const albumText = albumLabel({ album: albumKey, track });
    const sameName = meta.title === albumText && meta.title !== 'Космоцветок';
    const shownName = sameName ? albumText : meta.title;
    const coverHtml = `<div class="track-cover ph" data-cover-album="${esc(albumKey)}" data-cover-track="${esc(track)}">♪</div>`;

    const rows = indices.map(i => {
        const quote = getQuote(i);
        const seen = seenState.indices.includes(i);
        const isSecret = i >= quotes.length;
        const secretClass = isSecret ? ' secret' : '';
        const noteHtml = isSecret && quote.note
            ? `<span class="cat-note">${esc(quote.note)}</span>`
            : '';

        if (seen) {
            return `<div class="cat-item seen${secretClass}">
                <span class="dot"></span>
                <span class="cat-text-wrap">
                    <span>«${esc(quote.text)}»</span>
                    ${noteHtml}
                </span>
            </div>`;
        }
        return `<div class="cat-item locked${secretClass}">
            <span class="dot"></span>
            <span class="cat-body">
                <span class="cat-text">«${esc(quote.text)}»</span>
                <span class="cat-mask">
                    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M4 7V5a4 4 0 118 0v2M3 7h10v7H3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                    Закрыто
                </span>
                ${noteHtml}
            </span>
        </div>`;
    }).join('');

    return `<div class="track-group">
        <div class="track-head">
            ${coverHtml}
            <div class="track-head-info">
                <p class="track-title">${esc(shownName)}</p>
                ${fh ? `<p class="track-feats">${fh}</p>` : ''}
            </div>
        </div>
        ${rows}
    </div>`;
}

let coverObserver = null;
function hydrateCatalogCovers() {
    if (coverObserver) coverObserver.disconnect();
    coverObserver = new IntersectionObserver(entries => {
        for (const en of entries) {
            if (!en.isIntersecting) continue;
            const el = en.target;
            coverObserver.unobserve(el);

            if (el.hasAttribute('data-cover-track')) {
                const albumKey = el.dataset.coverAlbum;
                const track    = el.dataset.coverTrack;
                resolveCover({ album: albumKey, track }).then(url => {
                    if (!url) return;
                    const img = document.createElement('img');
                    img.className = 'track-cover';
                    img.alt = ''; img.referrerPolicy = 'no-referrer';
                    img.onload = () => el.replaceWith(img);
                    img.src = url;
                });
                continue;
            }

            if (el.classList.contains('album-cover-wrap')) {
                const albumKey = el.dataset.coverAlbum;
                if (!albumKey) continue;
                const first = quotes.find(q => q.album === albumKey)
                    || secretQuotes.find(q => q.album === albumKey);
                if (!first) continue;
                resolveCover(first).then(url => {
                    if (!url) return;
                    const img = document.createElement('img');
                    img.alt = ''; img.referrerPolicy = 'no-referrer';
                    img.onload = () => {
                        el.innerHTML = '';
                        el.classList.remove('ph');
                        el.appendChild(img);
                    };
                    img.src = url;
                });
            }
        }
    }, { root: catalogBody, rootMargin: '200px' });

    catalogBody.querySelectorAll('.album-card').forEach(el => coverObserver.observe(el));
    catalogBody.querySelectorAll('[data-cover-track]').forEach(el => coverObserver.observe(el));
    catalogBody.querySelectorAll('.album-cover-wrap[data-cover-album]').forEach(el => coverObserver.observe(el));
}

function openCatalog() {
    openAlbumKey = null;
    renderCatalog('');
    renderAchievementsBar();
    catalogSearch.value = '';
    catalogModal.hidden = false;
    document.body.style.overflow = 'hidden';
    checkAchievements();
}
function closeCatalog() {
    catalogModal.hidden = true;
    document.body.style.overflow = '';
    openAlbumKey = null;
}

catalogBtn.addEventListener('click', openCatalog);
catalogClose.addEventListener('click', closeCatalog);
catalogModal.addEventListener('click', (e) => { if (e.target === catalogModal) closeCatalog(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !catalogModal.hidden) closeCatalog(); });
catalogSearch.addEventListener('input', (e) => { openAlbumKey = null; renderCatalog(e.target.value); });

// ==========================================
// СМЕНА ДНЯ
// ==========================================
function checkDayChange() {
    const today = todayKey();
    if (limitState.date !== today) {
        limitState = { date: today, count: 0 };
        saveLimitState(limitState);
    }
    updateCounter();
}
setInterval(checkDayChange, 60 * 1000);

checkDayChange();
updateCounter();
updateResetTimer();
</script>
