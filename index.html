<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#080a09">
        <title>Моя цитата — строчки, которые остаются</title>
        <style>
            :root {
                color-scheme: dark;
                --ink: #080a09;
                --paper: #f3f4ef;
                --muted: #858585;
                --mint: #ffffff;
                --acid: #ffffff;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100svh;
                margin: 0;
                overflow-x: hidden;
                background: var(--ink);
                color: var(--paper);
                font-family: "Arial", "Helvetica Neue", sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            body::before {
                position: fixed;
                z-index: 0;
                inset: 0;
                pointer-events: none;
                content: "";
                opacity: .18;
                background-image: radial-gradient(#ffffff 0.65px, transparent 0.65px);
                background-size: 7px 7px;
                mask-image: linear-gradient(115deg, transparent 8%, #000 60%, transparent 98%);
            }

            .page {
                position: relative;
                display: flex;
                min-height: 100svh;
                flex-direction: column;
                width: min(100% - 48px, 1280px);
                margin: auto;
            }

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 30px 0;
                border-bottom: 1px solid #ffffff20;
                font-size: 12px;
                font-weight: 800;
                letter-spacing: .16em;
                text-transform: uppercase;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .brand-mark {
                width: 10px;
                height: 10px;
                background: var(--acid);
            }

            .album-cover {
                display: block;
                width: 64px;
                height: 64px;
                object-fit: cover;
            }

            main {
                display: grid;
                flex: 1;
                align-content: center;
                justify-items: center;
                padding: 80px 0 100px;
                text-align: center;
            }

            .eyebrow {
                margin: 0 0 28px;
                color: var(--mint);
                font-size: 12px;
                font-weight: 800;
                letter-spacing: .24em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                font-size: clamp(48px, 9vw, 124px);
                font-weight: 900;
                letter-spacing: -.075em;
                line-height: .88;
                text-transform: uppercase;
            }

            h1 span {
                display: block;
                color: var(--mint);
            }

            .intro {
                max-width: 420px;
                margin: 28px auto 0;
                color: #adb2ae;
                font-size: 15px;
                line-height: 1.6;
            }

            button {
                display: inline-flex;
                min-height: 58px;
                align-items: center;
                justify-content: center;
                gap: 14px;
                margin-top: 38px;
                padding: 0 24px;
                border: 0;
                background: var(--acid);
                color: var(--ink);
                cursor: pointer;
                font: inherit;
                font-size: 13px;
                font-weight: 900;
                letter-spacing: .11em;
                text-transform: uppercase;
                transition: transform .2s ease, background .2s ease;
            }

            button:hover {
                transform: translateY(-3px);
                background: #d9d9d9;
            }

            button:focus-visible {
                outline: 2px solid var(--paper);
                outline-offset: 5px;
            }

            button .arrow {
                display: inline-flex;
                width: 16px;
                height: 16px;
            }

            button .arrow svg {
                display: block;
                width: 100%;
                height: 100%;
            }

            .quote-card {
                position: relative;
                width: min(100%, 760px);
                min-height: 180px;
                margin-top: 56px;
                padding: 34px 34px 30px;
                border: 1px solid #ffffff24;
                background: #111412e8;
                animation: card-in .9s ease both;
            }

            .quote-card::before {
                position: absolute;
                top: -36px;
                left: 50%;
                z-index: 1;
                width: 25px;
                height: 34px;
                clip-path: path("M 12.5 0 C 9 7, 1 18, 1 23 C 1 30, 6 34, 12.5 34 C 19 34, 24 30, 24 23 C 24 18, 16 7, 12.5 0 Z");
                background: var(--paper);
                content: "";
                opacity: 0;
                transform: translate(-50%, -20px) scale(.65,.8);
                pointer-events: none;
            }

            .quote-card::after {
                position: absolute;
                top: -3px;
                left: 50%;
                width: 150px;
                height: 48px;
                background: radial-gradient(circle at 13% 28%, #fff 0 2px, transparent 3px), radial-gradient(circle at 87% 25%, #fff 0 2px, transparent 3px), radial-gradient(circle at 28% 9%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 72% 7%, #fff 0 1.5px, transparent 2.5px), radial-gradient(ellipse at center, transparent 27%, #fff 29% 31%, transparent 33% 52%, #fff 54% 56%, transparent 58% 76%, #fff 78% 80%, transparent 82%);
                content: "";
                opacity: 0;
                transform: translate(-50%, -50%) scale(.15, .35);
                pointer-events: none;
            }

            .quote-card.dropping::before {
                animation: drop-in .72s cubic-bezier(.2,.7,.25,1) both;
            }

            .quote-card.dropping::after {
                animation: splash .55s .57s ease-out both;
            }

            .quote-card.dropping .quote-text, .quote-card.dropping .track, .quote-card.dropping .album {
                animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both;
            }

            .quote-card.dropping .listen-link {
                animation: reveal .55s 1s cubic-bezier(.2,.7,.2,1) both;
            }

            .quote-card[hidden] {
                display: none;
            }

            .quote-text {
                margin: 0 auto;
                font-size: clamp(22px, 4.2vw, 38px);
                font-weight: 800;
                letter-spacing: -.045em;
                line-height: 1.23;
            }

            .track {
                margin: 20px 0 0;
                color: var(--mint);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: .18em;
                text-transform: uppercase;
            }
            
            .album {
                margin: 2px 0 0;
                color: var(--mint);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: .18em;
                text-transform: uppercase;
            }

            .listen-link {
                display: inline-flex;
                min-height: 42px;
                align-items: center;
                justify-content: center;
                gap: 12px;
                margin-top: 24px;
                padding: 0 16px;
                border: 1px solid #ffffff70;
                color: var(--paper);
                font-size: 10px;
                font-weight: 800;
                letter-spacing: .13em;
                text-decoration: none;
                text-transform: uppercase;
                transition: background .2s ease, color .2s ease;
            }

            .listen-link:hover {
                background: var(--paper);
                color: var(--ink);
            }

            .listen-link svg {
                width: 13px;
                height: 13px;
            }

            footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 20px 0 26px;
                border-top: 1px solid #ffffff20;
                color: #727a75;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: .13em;
                text-transform: uppercase;
            }

            footer span:last-child {
                color: var(--mint);
            }

            @keyframes card-in {
                from {
                    opacity: 0;
                    transform: translateY(-8px) scale(.985);
                }

                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes drop-in {
                0% {
                    opacity: 0;
                    transform: translate(-50%, -34px) scale(.65,.8);
                }

                12% {
                    opacity: 1;
                }

                70% {
                    opacity: 1;
                    transform: translate(-50%, 44px) scale(.9,1.15);
                }

                82% {
                    opacity: 1;
                    transform: translate(-50%, 35px) scale(1.1,.8);
                }

                100% {
                    opacity: 0;
                    transform: translate(-50%, 40px) scale(1.1,.8);
                }
            }

            @keyframes splash {
                0% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(.15, .35);
                }

                14% {
                    opacity: 1;
                }

                100% {
                    opacity: 0;
                    transform: translate(-50%, -50%) scale(1, 1);
                }
            }

            @keyframes reveal {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                    filter: blur(5px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                    filter: blur(0);
                }
            }

            @media (max-width: 560px) {
                .page {
                    width: min(100% - 32px, 1280px);
                }

                header {
                    padding: 22px 0;
                    font-size: 10px;
                }

                .album-cover {
                    width: 48px;
                    height: 48px;
                }

                main {
                    padding: 66px 0 76px;
                }

                .intro {
                    font-size: 14px;
                }

                .quote-card {
                    min-height: 0;
                    padding: 28px 20px 25px;
                    margin-top: 42px;
                }

                footer {
                    font-size: 8px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    scroll-behavior: auto !important;
                    animation-duration: .01ms !important;
                    transition-duration: .01ms !important;
                }
            }

            /* === Счётчик и каталог === */
            .counter {
                margin-top: 18px;
                color: var(--muted);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: .16em;
                text-transform: uppercase;
            }
            .counter strong { color: var(--paper); }
            .counter.limit { color: #ff6b6b; }

            .catalog-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-top: 14px;
                padding: 10px 16px;
                border: 1px solid #ffffff40;
                background: transparent;
                color: var(--paper);
                cursor: pointer;
                font: inherit;
                font-size: 11px;
                font-weight: 800;
                letter-spacing: .14em;
                text-transform: uppercase;
                transition: background .2s ease, color .2s ease;
            }
            .catalog-btn:hover { background: var(--paper); color: var(--ink); }

            .modal {
                position: fixed;
                inset: 0;
                z-index: 100;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #000000cc;
                backdrop-filter: blur(4px);
                animation: fade-in .2s ease both;
            }
            .modal[hidden] { display: none; }

            .modal-box {
                display: flex;
                flex-direction: column;
                width: min(100%, 760px);
                max-height: 86svh;
                border: 1px solid #ffffff30;
                background: #0e100f;
            }

            .modal-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 18px 22px;
                border-bottom: 1px solid #ffffff20;
            }
            .modal-head h2 {
                margin: 0;
                font-size: 13px;
                font-weight: 900;
                letter-spacing: .18em;
                text-transform: uppercase;
            }
            .modal-head .close {
                width: 34px;
                height: 34px;
                min-height: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #ffffff40;
                background: transparent;
                color: var(--paper);
                cursor: pointer;
                font-size: 16px;
                line-height: 1;
                margin-top: 0;
            }
            .modal-head .close:hover { background: var(--paper); color: var(--ink); }

            .modal-search {
                padding: 12px 22px;
                border-bottom: 1px solid #ffffff20;
            }
            .modal-search input {
                width: 100%;
                padding: 10px 12px;
                border: 1px solid #ffffff30;
                background: #080a09;
                color: var(--paper);
                font: inherit;
                font-size: 13px;
                outline: none;
            }
            .modal-search input:focus { border-color: #ffffff70; }

            .modal-body {
                overflow-y: auto;
                padding: 8px 22px 22px;
            }

            .cat-track {
                margin: 20px 0 8px;
                color: var(--mint);
                font-size: 11px;
                font-weight: 800;
                letter-spacing: .18em;
                text-transform: uppercase;
            }
            .cat-album {
                margin-left: 8px;
                color: var(--muted);
                font-weight: 700;
            }
            .cat-item {
                display: flex;
                gap: 10px;
                padding: 10px 0;
                border-bottom: 1px solid #ffffff10;
                color: #c9ccc8;
                font-size: 14px;
                line-height: 1.5;
            }
            .cat-item .dot {
                flex: 0 0 auto;
                width: 6px;
                height: 6px;
                margin-top: 8px;
                background: #ffffff40;
            }
            .cat-item.seen .dot { background: #4caf50; }
            .cat-item.seen { color: #6d736f; }

            @keyframes fade-in {
                from { opacity: 0; }
                to   { opacity: 1; }
            }

            /* === Обложки и фиты === */
            .card-cover {
                display: block;
                width: 104px;
                height: 104px;
                margin: 26px auto 0;
                object-fit: cover;
                border: 1px solid #ffffff24;
                background: #1a1d1b;
            }
            .card-cover[hidden] { display: none; }
            .quote-card.dropping .card-cover { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }
            .quote-card.dropping .feats { animation: reveal .55s .82s cubic-bezier(.2,.7,.2,1) both; }
            .track { margin-top: 14px; }

            .feats {
                margin: 8px 0 0;
                color: #adb2ae;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: .1em;
                text-transform: uppercase;
            }
            .feats[hidden] { display: none; }
            .feats b { color: var(--paper); }
            .badge {
                display: inline-block;
                margin-right: 6px;
                padding: 2px 6px;
                border: 1px solid #ffffff50;
                color: var(--paper);
                font-size: 9px;
                letter-spacing: .14em;
            }

            .cat-head {
                display: flex;
                align-items: center;
                gap: 14px;
                margin: 22px 0 6px;
            }
            .cat-cover {
                flex: 0 0 auto;
                width: 56px;
                height: 56px;
                object-fit: cover;
                border: 1px solid #ffffff24;
                background: #1a1d1b;
            }
            .cat-cover.ph {
                display: flex;
                align-items: center;
                justify-content: center;
                color: #ffffff40;
                font-size: 20px;
            }
            .cat-head .cat-track { margin: 0; }
            .cat-head .feats { margin: 5px 0 0; font-size: 10px; }
        </style>
    </head>

    // ==========================================
    // ОБЛОЖКИ И ФИТЫ
    // ==========================================
    const LS_COVERS = 'mzlff:covers';
    const ARTIST_RE = /mzlff/i;
    let coverCache = {};
    try { coverCache = JSON.parse(localStorage.getItem(LS_COVERS) || '{}') || {}; } catch (e) {}
    function saveCoverCache() { try { localStorage.setItem(LS_COVERS, JSON.stringify(coverCache)); } catch (e) {} }

    function esc(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // "Название (feat. A, B)" -> { title: 'Название', feats: ['A', 'B'] }
    function parseTrack(raw) {
        const m = raw.match(/\s*[\(\[]\s*(?:feat\.?|ft\.?|при уч\.?|совм\.? с)\s+([^)\]]+)[\)\]]\s*$/i);
        if (!m) return { title: raw, feats: [] };
        const feats = m[1].split(/\s*(?:,|&|×|\s+x\s+|\s+и\s+|\s+and\s+)\s*/i).map(x => x.trim()).filter(Boolean);
        return { title: raw.slice(0, m.index).trim(), feats };
    }

    // "Имя (Latin name)" / "Имя (RUS)" -> "Имя" (оставляем только основное имя)
    function shortName(n) {
        const s = String(n || '').trim();
        return s.replace(/\s*[\(\[][^)\]]*[\)\]]\s*$/, '').trim() || s;
    }

    function trackMeta(quote) {
        const parsed = parseTrack(quote.track);
        const info = TRACK_INFO[quote.album + '|' + quote.track] || {};
        const isFit = quote.album.startsWith('fit_');
        const feats = [...new Set((info.feats && info.feats.length ? info.feats : parsed.feats).map(shortName))].filter(n => n && !ARTIST_RE.test(n));
        return { title: parsed.title, feats, main: shortName(info.main || ''), isFit };
    }

    // HTML-строка с информацией о фитах ('' если фитов нет)
    function featsHtml(quote) {
        const m = trackMeta(quote);
        const parts = [];
        if (m.isFit) {
            parts.push('<span class="badge">ФИТ</span>' + (m.main ? 'трек <b>' + esc(m.main) + '</b>' : 'mzlff в гостях'));
            if (m.feats.length) parts.push('с ' + m.feats.map(n => '<b>' + esc(n) + '</b>').join(', '));
        } else if (m.feats.length) {
            parts.push('<span class="badge">FEAT</span>' + m.feats.map(n => '<b>' + esc(n) + '</b>').join(', '));
        }
        return parts.join(' · ');
    }

    function albumLabel(quote) {
        const a = albums[quote.album];
        if (a && a.title) return a.title;
        if (quote.album.startsWith('fit_')) return 'Фит';
        if (quote.album.startsWith('singl_')) return 'Сингл';
        return quote.album;
    }

    // --- живой поиск обложки в браузере (только сервисы без ключа и с CORS/JSONP) ---
    function jsonp(url, timeout = 6000) {
        return new Promise((resolve, reject) => {
            const cb = '__jp' + Math.random().toString(36).slice(2);
            const el = document.createElement('script');
            const done = (fn, v) => { delete window[cb]; el.remove(); clearTimeout(t); fn(v); };
            const t = setTimeout(() => done(reject, new Error('timeout')), timeout);
            window[cb] = data => done(resolve, data);
            el.onerror = () => done(reject, new Error('error'));
            el.src = url + (url.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
            document.head.appendChild(el);
        });
    }

    async function liveItunes(term) {
        const r = await fetch('https://itunes.apple.com/search?entity=song&limit=8&term=' + encodeURIComponent('mzlff ' + term));
        const j = await r.json();
        const hit = (j.results || []).find(x => ARTIST_RE.test(x.artistName || '') && x.artworkUrl100);
        return hit ? hit.artworkUrl100.replace(/\d+x\d+bb/, '600x600bb') : '';
    }
    async function liveDeezer(term) {
        const j = await jsonp('https://api.deezer.com/search?q=' + encodeURIComponent('artist:"mzlff" ' + term));
        const hit = (j.data || []).find(x => x.album && x.album.cover_big);
        return hit ? hit.album.cover_big : '';
    }

    // очередь: не более одного запроса за раз, чтобы не ловить лимиты API
    let liveQueue = Promise.resolve();
    const inflight = {};
    function resolveCover(quote) {
        const key = quote.album;
        const a = albums[key] || {};
        const known = a.cover || COVERS[key] || coverCache[key];
        if (known) return Promise.resolve(known);
        if (coverCache[key] === '') return Promise.resolve('');
        if (inflight[key]) return inflight[key];
        const term = (a.title || parseTrack(quote.track).title).replace(/\s*\(.*?\)\s*/g, ' ').trim();
        inflight[key] = liveQueue = liveQueue.then(async () => {
            let url = '';
            for (const fn of [liveItunes, liveDeezer]) {
                try { url = await fn(term); } catch (e) {}
                if (url) break;
            }
            coverCache[key] = url;
            saveCoverCache();
            await new Promise(r => setTimeout(r, 350));
            return url;
        });
        return inflight[key];
    }

    function setImg(img, url) {
        if (!url) { img.hidden = true; return; }
        img.onerror = () => { img.hidden = true; };
        img.onload = () => { img.hidden = false; };
        img.src = url;
    }

    // ==========================================
    // НАСТРОЙКИ ЛИМИТА
    // ==========================================
    const DAILY_LIMIT = 9999;
    const LS_LIMIT   = 'mzlff:limit';
    const LS_SEEN    = 'mzlff:seen';

    // ==========================================
    // УТИЛИТЫ
    // ==========================================
    function todayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function loadLimitState() {
        try {
            const raw = JSON.parse(localStorage.getItem(LS_LIMIT) || 'null');
            if (raw && raw.date === todayKey()) return raw;
        } catch (e) {}
        return { date: todayKey(), count: 0 };
    }

    function saveLimitState(state) {
        try { localStorage.setItem(LS_LIMIT, JSON.stringify(state)); } catch (e) {}
    }

    function loadSeen() {
        try {
            const raw = JSON.parse(localStorage.getItem(LS_SEEN) || 'null');
            if (raw && raw.date === todayKey() && Array.isArray(raw.indices)) return raw;
        } catch (e) {}
        return { date: todayKey(), indices: [] };
    }

    function saveSeen(seen) {
        try { localStorage.setItem(LS_SEEN, JSON.stringify(seen)); } catch (e) {}
    }

    // ==========================================
    // СОСТОЯНИЕ
    // ==========================================
    let limitState = loadLimitState();
    let seenState  = loadSeen();

    // ==========================================
    // DOM
    // ==========================================
    const button       = document.querySelector('#quote-button');
    const card         = document.querySelector('#quote-card');
    const quoteText    = document.querySelector('#quote-text');
    const trackName    = document.querySelector('#track-name');
    const albumName    = document.querySelector('#album-name');
    const listenLink   = document.querySelector('#listen-link');
    const counterEl    = document.querySelector('#counter');
    const coverImg     = document.querySelector('#cover-img');
    const featsEl      = document.querySelector('#feats');
    const catalogBtn   = document.querySelector('#catalog-button');
    const catalogModal = document.querySelector('#catalog-modal');
    const catalogClose = document.querySelector('#catalog-close');
    const catalogBody  = document.querySelector('#catalog-body');
    const catalogSearch= document.querySelector('#catalog-search');

    // ==========================================
    // СЧЁТЧИК
    // ==========================================
    function updateCounter() {
        const remaining = Math.max(0, DAILY_LIMIT - limitState.count);
        counterEl.innerHTML = `Сегодня осталось: <strong>${remaining}</strong> из ${DAILY_LIMIT}`;
        counterEl.classList.toggle('limit', remaining === 0);
        button.disabled = remaining === 0;
        button.style.opacity = remaining === 0 ? .5 : 1;
        button.style.cursor  = remaining === 0 ? 'not-allowed' : 'pointer';
    }

    // ==========================================
    // ВЫБОР НЕПОВТОРЯЮЩЕЙСЯ ЦИТАТЫ
    // ==========================================
    function pickQuoteIndex() {
        const total = quotes.length;
        if (seenState.indices.length >= total) {
            seenState.indices = [];
        }
        const used = new Set(seenState.indices);
        const available = [];
        for (let i = 0; i < total; i++) {
            if (!used.has(i)) available.push(i);
        }
        if (available.length === 0) return -1;
        return available[Math.floor(Math.random() * available.length)];
    }

    // ==========================================
    // ПОКАЗ ЦИТАТЫ
    // ==========================================
    button.addEventListener('click', () => {
        if (limitState.count >= DAILY_LIMIT) return;

        const index = pickQuoteIndex();
        if (index < 0) return;

        seenState.indices.push(index);
        saveSeen(seenState);

        limitState.count += 1;
        saveLimitState(limitState);
        updateCounter();

        const quote = quotes[index];

        quoteText.textContent = '«' + quote.text + '»';
        const meta = trackMeta(quote);
        trackName.textContent = meta.title;

        const albumData = albums[quote.album];
        albumName.textContent = albumLabel(quote);
        listenLink.href = albumData ? albumData.url : '#';

        const fh = featsHtml(quote);
        featsEl.innerHTML = fh;
        featsEl.hidden = !fh;

        coverImg.hidden = true;
        resolveCover(quote).then(url => { if (trackName.textContent === meta.title) setImg(coverImg, url); });

        card.hidden = false;
        card.classList.remove('dropping');
        void card.offsetWidth;
        card.classList.add('dropping');

        if (limitState.count >= DAILY_LIMIT) {
            setTimeout(() => {
                counterEl.textContent = 'Лимит на сегодня исчерпан. Возвращайся завтра 🌙';
            }, 400);
        }
    });

    // ==========================================
    // КАТАЛОГ ЦИТАТ
    // ==========================================
    function renderCatalog(filter = '') {
        const seenSet = new Set(seenState.indices);
        const groups  = new Map();

        const q = filter.trim().toLowerCase();

        quotes.forEach((quote, i) => {
            const m = trackMeta(quote);
            if (q) {
                const hay = (quote.text + ' ' + m.title + ' ' + albumLabel(quote) + ' ' + m.feats.join(' ') + ' ' + m.main + ' ' + (m.isFit ? 'фит feat' : '')).toLowerCase();
                if (!hay.includes(q)) return;
            }
            const gk = quote.album + '|' + quote.track;
            if (!groups.has(gk)) groups.set(gk, []);
            groups.get(gk).push({ i, quote });
        });

        if (groups.size === 0) {
            catalogBody.innerHTML = '<p style="color:#858585;padding:24px 0;text-align:center">Ничего не найдено.</p>';
            return;
        }

        let html = '';
        for (const [gk, items] of groups) {
            const first = items[0].quote;
            const m = trackMeta(first);
            const fh = featsHtml(first);
            html += `<div class="cat-head">
                <div class="cat-cover ph" data-cover-album="${esc(first.album)}" data-cover-track="${esc(first.track)}">♪</div>
                <div>
                    <div class="cat-track">${esc(m.title)}<span class="cat-album">— ${esc(albumLabel(first))}</span></div>
                    ${fh ? `<div class="feats">${fh}</div>` : ''}
                </div>
            </div>`;
            for (const { i, quote } of items) {
                const seen = seenSet.has(i) ? ' seen' : '';
                html += `<div class="cat-item${seen}"><span class="dot"></span><span>«${esc(quote.text)}»</span></div>`;
            }
        }
        catalogBody.innerHTML = html;
        hydrateCatalogCovers();
    }

    // обложки в каталоге подгружаются лениво — только когда блок виден на экране
    let coverObserver = null;
    function hydrateCatalogCovers() {
        if (coverObserver) coverObserver.disconnect();
        coverObserver = new IntersectionObserver(entries => {
            for (const en of entries) {
                if (!en.isIntersecting) continue;
                const el = en.target;
                coverObserver.unobserve(el);
                const quote = { album: el.dataset.coverAlbum, track: el.dataset.coverTrack };
                resolveCover(quote).then(url => {
                    if (!url) return;
                    const img = document.createElement('img');
                    img.className = 'cat-cover';
                    img.alt = '';
                    img.referrerPolicy = 'no-referrer';
                    img.onload = () => el.replaceWith(img);
                    img.src = url;
                });
            }
        }, { root: catalogBody, rootMargin: '200px' });
        catalogBody.querySelectorAll('[data-cover-album]').forEach(el => coverObserver.observe(el));
    }

    function openCatalog() {
        renderCatalog('');
        catalogSearch.value = '';
        catalogModal.hidden = false;
        document.body.style.overflow = 'hidden';
    }

    function closeCatalog() {
        catalogModal.hidden = true;
        document.body.style.overflow = '';
    }

    catalogBtn.addEventListener('click', openCatalog);
    catalogClose.addEventListener('click', closeCatalog);
    catalogModal.addEventListener('click', (e) => {
        if (e.target === catalogModal) closeCatalog();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !catalogModal.hidden) closeCatalog();
    });
    catalogSearch.addEventListener('input', (e) => renderCatalog(e.target.value));

    // ==========================================
    // ПРОВЕРКА СМЕНЫ ДНЯ
    // ==========================================
    function checkDayChange() {
        const today = todayKey();
        if (limitState.date !== today) {
            limitState = { date: today, count: 0 };
            saveLimitState(limitState);
        }
    }
    setInterval(checkDayChange, 60 * 1000);

    // ==========================================
    // ИНИЦИАЛИЗАЦИЯ
    // ==========================================
    checkDayChange();
    updateCounter();
