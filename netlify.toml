[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# служебные файлы не должны отдаваться посетителям
[[redirects]]
  from = "/fetch_covers.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
